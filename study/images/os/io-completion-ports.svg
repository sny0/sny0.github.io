<svg xmlns="http://www.w3.org/2000/svg" width="760" height="512" viewBox="0 0 760 512" role="img" aria-labelledby="title description">
  <title id="title">複数のI/O要求の完了が一つのポートに集まる</title>
  <desc id="description">完了キー10のファイルAにA1とA2、キー20のファイルBにB1を発行する。完了パケットが入った順はA2、B1、A1。A1とA2はキーが同じで、OVERLAPPEDのアドレスが異なる。ワーカーは完了ポートからパケットを取り出す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#45677d"/>
    </marker>
  </defs>
  <rect width="760" height="512" rx="16" fill="#f3f7fa"/>
  <g font-family="system-ui, sans-serif" fill="#183246">
    <text x="24" y="43" font-size="25" font-weight="700">I/Oの完了が一つのポートに集まる</text>
    <text x="24" y="72" font-size="18" fill="#455b6b">二つのハンドルに対し、三つの読み取りを発行した例</text>
    <g stroke-width="1.5">
      <rect x="24" y="95" width="430" height="100" rx="12" fill="#dcebf4" stroke="#86a9bd"/>
      <rect x="478" y="95" width="258" height="100" rx="12" fill="#d8eee6" stroke="#82ad9f"/>
    </g>
    <g font-size="21" font-weight="700">
      <text x="44" y="132">ファイル A　キー 10</text>
      <text x="498" y="132">ファイル B　キー 20</text>
    </g>
    <g font-size="17">
      <text x="44" y="168">要求 A1（&amp;ovA1）・要求 A2（&amp;ovA2）</text>
      <text x="498" y="168">要求 B1（&amp;ovB1）</text>
    </g>
    <g stroke="#45677d" stroke-width="2" marker-end="url(#arrow)">
      <path d="M239 195v46"/>
      <path d="M607 195v46"/>
      <path d="M380 380v35"/>
    </g>
    <rect x="24" y="243" width="712" height="137" rx="12" fill="#fff" stroke="#9bb2bf" stroke-width="1.5"/>
    <text x="44" y="276" font-size="21" font-weight="700">IOCP　完了キュー</text>
    <text x="713" y="276" text-anchor="end" font-size="17" fill="#455b6b">この例でキューに入った順</text>
    <g stroke-width="1.5">
      <rect x="44" y="291" width="212" height="72" rx="8" fill="#dcebf4" stroke="#86a9bd"/>
      <rect x="274" y="291" width="212" height="72" rx="8" fill="#d8eee6" stroke="#82ad9f"/>
      <rect x="504" y="291" width="212" height="72" rx="8" fill="#dcebf4" stroke="#86a9bd"/>
    </g>
    <g text-anchor="middle" font-size="20" font-weight="700">
      <text x="150" y="321">1　A2 の完了</text>
      <text x="380" y="321">2　B1 の完了</text>
      <text x="610" y="321">3　A1 の完了</text>
    </g>
    <g text-anchor="middle" font-size="17">
      <text x="150" y="346">キー 10 ／ &amp;ovA2</text>
      <text x="380" y="346">キー 20 ／ &amp;ovB1</text>
      <text x="610" y="346">キー 10 ／ &amp;ovA1</text>
    </g>
    <rect x="126" y="417" width="508" height="72" rx="12" fill="#fff1d4" stroke="#c2a36d" stroke-width="1.5"/>
    <text x="380" y="448" text-anchor="middle" font-size="21" font-weight="700">ワーカーが完了を取り出す</text>
    <text x="380" y="474" text-anchor="middle" font-size="17" fill="#455b6b">GetQueuedCompletionStatus</text>
  </g>
</svg>
