<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc">
  <title id="title">聞き手に向かう速度で聞こえる周波数が変わる</title>
  <desc id="desc">音速343 m/s、音源440 Hzでの理論値。聞き手に向かう速度がマイナス40 m/sでは394.05 Hz、ゼロでは440 Hz、プラス40 m/sでは498.09 Hzになる。</desc>
