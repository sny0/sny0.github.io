    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; fill: #1e293b; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .note { font-size: 15px; fill: #475569; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="414" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="48" class="title">聞き手に向かうほど周波数が高くなる</text>
  <text x="36" y="76" class="note">聞こえる周波数（Hz）。音源は440 Hz、音速は343 m/s。</text>
  <rect x="84" y="93" width="308" height="237" fill="#f5f3ff"/>
  <rect x="392" y="93" width="308" height="237" fill="#f0fdfa"/>
