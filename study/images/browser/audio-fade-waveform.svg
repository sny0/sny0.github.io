L674 573 L677.75 573 L681.5 573 L685.25 573 L689 573 L692.75 573 L696.5 573 L700.25 573 L704 573"/>

  <rect class="panel" x="36" y="728" width="688" height="189" rx="18"/>
  <text class="heading" x="57" y="767">250 msの境界を1フレームずつ読む</text>
  <text class="tick" x="373" y="810" text-anchor="middle">11,999番</text>
  <text class="tick" x="612" y="810" text-anchor="middle">12,000番</text>
  <path class="axis" d="M57 821H703"/>
  <text class="body" x="57" y="850">一度に下げる</text>
  <text class="sample" x="373" y="850" text-anchor="middle">0.399452</text>
  <text class="sample" x="612" y="850" text-anchor="middle">0.000000</text>
  <text class="body" x="57" y="886">フェード</text>
  <text class="sample" x="373" y="886" text-anchor="middle">0.399452</text>
  <text class="sample" x="612" y="886" text-anchor="middle">0.400000</text>
</svg>
