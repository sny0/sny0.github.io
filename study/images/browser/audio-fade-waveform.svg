<svg xmlns="http://www.w3.org/2000/svg" width="760" height="960" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
  <title id="title">急に消音した波形とフェードの波形</title>
  <desc id="desc">245ミリ秒から265ミリ秒までの400 Hzの出力波形を比べる。上段では250ミリ秒の山でゼロに切り替わる。下段では250ミリ秒から振幅が小さくなり、260ミリ秒でゼロに達する。フレーム11999から12000の間で、一度に消音すると振幅は約0.399452から0、フェードでは約0.399452から0.40に変わる。</desc>
  <style>
    text { font-family: "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, sans-serif; fill: #183446; }
    .title { font-size: 31px; font-weight: 700; }
    .sub { font-size: 21px; fill: #385462; }
    .heading { font-size: 24px; font-weight: 700; }
    .body { font-size: 20px; }
    .tick { font-size: 18px; fill: #385462; }
    .sample { font-family: Consolas, monospace; font-size: 21px; }
    .panel { fill: #fff; stroke: #a6b8c2; stroke-width: 2; }
    .axis { fill: none; stroke: #8da5b2; stroke-width: 1.5; }
    .marker { fill: none; stroke: #7594a3; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .wave { fill: none; stroke: #17616d; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
    .step { stroke: #994735; }
    .envelope { fill: none; stroke: #6d9c9f; stroke-width: 1.7; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <g id="grid">
      <path class="axis" d="M104 -82V82H704 M104 0H704 M104 -82H704"/>
      <path class="marker" d="M254 -82V82 M554 -82V82"/>
      <text class="tick" x="91" y="-76" text-anchor="end">+0.40</text>
      <text class="tick" x="91" y="6" text-anchor="end">0</text>
      <text class="tick" x="91" y="88" text-anchor="end">−0.40</text>
      <text class="tick" x="104" y="111" text-anchor="middle">245</text>
      <text class="tick" x="254" y="111" text-anchor="middle">250</text>
      <text class="tick" x="554" y="111" text-anchor="middle">260</text>
      <text class="tick" x="704" y="111" text-anchor="end">265 ms</text>
    </g>
  </defs>
  <rect width="760" height="960" rx="24" fill="#eaf2f4"/>
  <text class="title" x="36" y="61">音を止める瞬間の波形を比べる</text>
  <text class="sub" x="36" y="100">400 Hzの余弦波を、同じ振幅の目盛で表示します。</text>

  <rect class="panel" x="36" y="126" width="688" height="282" rx="18"/>
  <text class="heading" x="57" y="166">一度に下げると、波形の山で段差ができる</text>
  <rect x="104" y="194" width="600" height="164" rx="5" fill="#f4f8fa"/>
  <use href="#grid" transform="translate(0 276)"/>
