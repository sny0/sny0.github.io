<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc">
  <title id="title">ずらしたインパルス応答をサンプルごとに加算する例</title>
  <desc id="desc">入力の1番目から0.6、0.3、0.15、0が生じる。入力の2番目から1サンプルずれた0、0.3、0.15、0.075が生じる。列ごとの合計は0.6、0.6、0.3、0.075。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; fill: #1f2937; }
      .title { font-size: 26px; font-weight: 700; }
      .note { font-size: 17px; fill: #475569; }
      .head { font-size: 17px; font-weight: 700; }
      .value { font-size: 21px; font-variant-numeric: tabular-nums; }
      .total { font-weight: 700; fill: #115e59; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="414" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="49" class="title">IRをずらし、重なった値を足す</text>
  <text x="36" y="80" class="note">入力 x = [1, 0.5]　　インパルス応答 h = [0.6, 0.3, 0.15]</text>

  <rect x="36" y="109" width="688" height="225" rx="10" fill="#fff" stroke="#cbd5e1"/>
  <rect x="352" y="110" width="124" height="223" fill="#e6fffb"/>
  <path d="M 36 157 H 724 M 36 218 H 724 M 36 277 H 724 M 228 109 V 334 M 352 109 V 334 M 476 109 V 334 M 600 109 V 334" fill="none" stroke="#cbd5e1"/>
  <g class="head">
    <text x="55" y="140">出力の時刻 n</text>
    <text x="290" y="140" text-anchor="middle">0</text>
    <text x="414" y="140" text-anchor="middle" class="total">1</text>
    <text x="538" y="140" text-anchor="middle">2</text>
    <text x="662" y="140" text-anchor="middle">3</text>
    <text x="55" y="181">入力 x[0] = 1</text>
    <text x="55" y="201" class="note">h をそのまま置く</text>
    <text x="55" y="242">入力 x[1] = 0.5</text>
    <text x="55" y="262" class="note">0.5倍して1つずらす</text>
    <text x="55" y="313" class="total">列ごとの合計</text>
  </g>
  <g class="value" text-anchor="middle">
    <text x="290" y="194">0.6</text>
    <text x="414" y="194">0.3</text>
    <text x="538" y="194">0.15</text>
    <text x="662" y="194">0</text>
    <text x="290" y="254">0</text>
    <text x="414" y="254">0.3</text>
    <text x="538" y="254">0.15</text>
    <text x="662" y="254">0.075</text>
    <g class="total">
      <text x="290" y="314">0.6</text>
      <text x="414" y="314">0.6</text>
      <text x="538" y="314">0.3</text>
      <text x="662" y="314">0.075</text>
    </g>
  </g>
  <text x="36" y="370" class="note">時刻1では 0.3 ＋ 0.3 = 0.6。</text>
  <text x="36" y="395" class="note">入力の最後のサンプルからも応答が続く。</text>
</svg>
