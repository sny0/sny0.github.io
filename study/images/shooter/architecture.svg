<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1440" viewBox="0 0 640 1440" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">入力、外側のAdapter、Model、描画の関係</title>
  <desc id="architecture-desc">入力デバイスをC++のmain.cppまたはUnityのShooterDemoが読み、FrameInputまたはShooterInputという値へ変換する。AdapterはWorldまたはShooterModelを作成して保持し、固定1/60秒ごとにTickを呼ぶ。描画はModelの状態を読み、C++のDrawWorldまたはUnityのSpriteRendererへ反映する。Model内の敵データの削除とGameObjectの破棄は別で、Unityの表示枠は再利用する。破線は所有、実線はデータの流れを表す。</desc>
  <defs>
    <marker id="architecture-green-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#245d48"/></marker>
    <marker id="architecture-purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b66a3"/></marker>
    <style>
      text{font-family:"Noto Sans JP","Yu Gothic","Hiragino Kaku Gothic ProN",sans-serif;fill:#26352e}
      .title{font-size:34px;font-weight:700}.head{font-size:30px;font-weight:700}.body{font-size:26px}.small{font-size:24px}.center{text-anchor:middle}
      .flow{fill:none;stroke:#245d48;stroke-width:4;marker-end:url(#architecture-green-arrow)}
      .view-flow{fill:none;stroke:#6b66a3;stroke-width:4;marker-end:url(#architecture-purple-arrow)}
    </style>
  </defs>
  <rect width="640" height="1440" rx="20" fill="#ffffff"/>
  <text class="title center" x="320" y="53">入力・Model・描画を分ける</text>
  <text class="body center" x="320" y="98">同じルールを C++ / Unity へ</text>

  <rect x="64" y="130" width="512" height="120" rx="18" fill="#f1f7f2" stroke="#245d48" stroke-width="3"/>
  <g fill="#ffffff" stroke="#245d48" stroke-width="2">
    <rect x="88" y="158" width="45" height="40" rx="6"/>
    <rect x="88" y="203" width="45" height="28" rx="5"/>
    <rect x="139" y="203" width="45" height="28" rx="5"/>
  </g>
  <text class="body center" x="110" y="188">↑</text>
  <text class="small center" x="110" y="226">←</text>
  <text class="small center" x="161" y="226">→</text>
  <text class="head" x="209" y="176">入力デバイス</text>
  <text class="small" x="209" y="218">移動・発射・R</text>
  <path class="flow" d="M320 251 V284"/>

  <rect x="24" y="296" width="592" height="1044" rx="22" fill="#f1f7f2" stroke="#245d48" stroke-width="3"/>
  <text class="head center" x="320" y="340">Adapter：外側の実行係</text>
  <text class="small center" x="320" y="380">C++ main.cpp / Unity ShooterDemo</text>
  <text class="small" x="435" y="419" fill="#245d48">作成・保持</text>
  <path d="M590 428 V735 H580" fill="none" stroke="#245d48" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#architecture-green-arrow)"/>

  <rect x="64" y="438" width="512" height="108" rx="16" fill="#ffffff" stroke="#245d48" stroke-width="2"/>
  <text class="head center" x="320" y="481">入力を値にする</text>
  <text class="body center" x="320" y="520">FrameInput / ShooterInput</text>
  <path class="flow" d="M320 548 V666"/>
  <rect x="183" y="569" width="274" height="77" rx="12" fill="#f1f7f2"/>
  <text class="head center" x="320" y="601">Tick(input)</text>
  <text class="body center" x="320" y="636">1/60秒ごと</text>

  <rect x="64" y="680" width="512" height="250" rx="18" fill="#ffffff" stroke="#245d48" stroke-width="4"/>
  <text class="head center" x="320" y="725">Model：ゲームの正本</text>
  <text class="body center" x="320" y="765">World / ShooterModel</text>
  <circle cx="151" cy="818" r="22" fill="#2479b8"/>
  <path d="M151 792 L139 826 L163 826 Z" fill="#2479b8" stroke="#ffffff" stroke-width="2"/>
  <circle cx="269" cy="818" r="10" fill="#d89a22"/>
  <path d="M269 800 V783" stroke="#d89a22" stroke-width="4"/>
  <circle cx="391" cy="818" r="20" fill="#d85b4b"/>
  <circle cx="442" cy="818" r="20" fill="#d85b4b"/>
  <text class="body center" x="151" y="868">自機</text>
  <text class="body center" x="269" y="868">弾</text>
  <text class="body center" x="416" y="868">敵</text>
  <text class="small center" x="320" y="909">HP・score・位置・有効フラグ</text>

  <path class="view-flow" d="M320 933 V1006"/>
  <rect x="196" y="950" width="248" height="43" rx="10" fill="#f1f7f2"/>
  <text class="body center" x="320" y="981" style="fill:#6b66a3">状態を読み取る</text>
  <rect x="64" y="1020" width="512" height="150" rx="18" fill="#f0eff7" stroke="#6b66a3" stroke-width="3"/>
  <text class="head center" x="320" y="1066">View：現在の状態を描く</text>
  <text class="body center" x="320" y="1110">DrawWorld / SpriteRenderer</text>
  <text class="small center" x="320" y="1150">表示数・位置・色を反映</text>

  <text class="body center" x="320" y="1221">敵の削除は Model の配列で行う</text>
  <text class="body center" x="320" y="1262">Unity の表示枠は同期・再利用</text>
  <text class="small center" x="320" y="1304">GameObject の破棄とは別の処理</text>

  <path d="M49 1387 H100" fill="none" stroke="#245d48" stroke-width="3" stroke-dasharray="7 5"/>
  <text class="small" x="112" y="1395">所有</text>
  <path class="flow" d="M235 1387 H280"/>
  <text class="small" x="295" y="1395">データの流れ</text>
</svg>
