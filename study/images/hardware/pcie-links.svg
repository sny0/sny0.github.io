<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424" role="img" aria-labelledby="title desc">
  <title id="title">ルートコンプレックスとPCIeリンク</title>
  <desc id="desc">CPUとRAMにつながるルートコンプレックスからGPUへx16で直結し、別のx4リンクはPCIeスイッチへつながる。NVMe SSDとNICはCPU側への通信でその上流x4を共有する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#476278"/>
    </marker>
  </defs>
  <rect width="760" height="424" rx="18" fill="#edf3f7"/>
  <g font-family="system-ui, 'Yu Gothic', Meiryo, sans-serif" fill="#153147">
    <text x="24" y="42" font-size="23" font-weight="700">PCIeは点対点のリンクをつなぐ</text>
    <text x="24" y="70" font-size="15" fill="#476278">各リンクに速度とレーン数があり、データは複数のリンクを通ることがある。</text>

    <rect x="24" y="93" width="712" height="66" rx="10" fill="#fff" stroke="#a9bdcc"/>
    <text x="40" y="119" font-size="17" font-weight="700">CPU・RAM側</text>
    <text x="40" y="143" font-size="15">ルートコンプレックス</text>
    <text x="211" y="143" font-size="14" fill="#476278">ポートA</text>
    <text x="491" y="143" font-size="14" fill="#476278">ポートB</text>

    <path d="M190 164V237" fill="none" stroke="#476278" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M470 164V237" fill="none" stroke="#476278" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="207" y="204" font-size="16" font-weight="700">x16</text>
    <text x="487" y="196" font-size="16" font-weight="700">上流 x4</text>
    <text x="487" y="219" font-size="14" fill="#476278">SSDとNICが共有</text>

    <rect x="80" y="244" width="220" height="56" rx="9" fill="#dfeef7" stroke="#a9bdcc"/>
    <rect x="370" y="244" width="200" height="56" rx="9" fill="#fff0d6" stroke="#cba86d"/>
    <text x="190" y="278" text-anchor="middle" font-size="17" font-weight="700">GPU</text>
    <text x="470" y="278" text-anchor="middle" font-size="17" font-weight="700">PCIeスイッチ</text>

    <path d="M407 306V350" fill="none" stroke="#476278" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M533 306V328H634V350" fill="none" stroke="#476278" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="421" y="335" font-size="15" font-weight="700">x4</text>
    <text x="647" y="345" font-size="15" font-weight="700">x1</text>
    <rect x="323" y="357" width="168" height="45" rx="9" fill="#dcefe6" stroke="#a2c2b3"/>
    <rect x="550" y="357" width="168" height="45" rx="9" fill="#dcefe6" stroke="#a2c2b3"/>
    <text x="407" y="386" text-anchor="middle" font-size="16" font-weight="700">NVMe SSD</text>
    <text x="634" y="386" text-anchor="middle" font-size="16" font-weight="700">NIC</text>
  </g>
</svg>
