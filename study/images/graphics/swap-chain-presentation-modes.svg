<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">同じ走査をFIFO、MAILBOX、IMMEDIATEで比較</title>
  <desc id="desc">16.67ミリ秒からの走査でFIFOはB、MAILBOXはCを全画面で使う。IMMEDIATEではCから始まり、23ミリ秒にDへ、30ミリ秒にEへ切り替わる。色と縦棒の位置が走査の途中で変わる。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#486078"/>
    </marker>
  </defs>
  <rect width="760" height="350" rx="18" fill="#f8fafc"/>
  <g font-family="'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" fill="#162334">
    <text x="25" y="40" font-size="23" font-weight="700">16.67 msからの1回の走査を比べる</text>
    <text x="25" y="67" font-size="16" fill="#475569">仮想60 Hz。縦棒は絵によって位置が変わる。</text>
    <path d="M731 56V72" stroke="#486078" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="716" y="67" text-anchor="end" font-size="15" fill="#475569">上から下へ読み出す</text>

    <g fill="#fff" stroke="#a8b7c9" stroke-width="1.4">
      <rect x="26" y="91" width="224" height="211" rx="10"/>
      <rect x="268" y="91" width="224" height="211" rx="10"/>
      <rect x="510" y="91" width="224" height="211" rx="10"/>
    </g>
    <g text-anchor="middle" font-size="19" font-weight="700">
      <text x="138" y="125">FIFO</text>
      <text x="380" y="125">MAILBOX</text>
      <text x="622" y="125">IMMEDIATE</text>
    </g>

    <rect x="42" y="142" width="192" height="124" fill="#dcecff"/>
    <rect x="284" y="142" width="192" height="124" fill="#dff3ec"/>
    <rect x="526" y="142" width="192" height="47.12" fill="#dff3ec"/>
    <rect x="526" y="189.12" width="192" height="52.08" fill="#fff1d9"/>
    <rect x="526" y="241.2" width="192" height="24.8" fill="#f6e8f6"/>
    <path d="M95 142V266 M363 142V266 M605 142V189.12 M631 189.12V241.2 M657 241.2V266" stroke="#253a50" stroke-width="8"/>
    <path d="M526 189.12H718 M526 241.2H718" stroke="#9e4530" stroke-width="1.4" stroke-dasharray="5 3"/>
    <g fill="none" stroke="#72859a" stroke-width="1.3">
      <rect x="42" y="142" width="192" height="124"/>
      <rect x="284" y="142" width="192" height="124"/>
      <rect x="526" y="142" width="192" height="124"/>
    </g>

    <g font-size="16" font-weight="700">
      <text x="55" y="211">B</text>
      <text x="297" y="211">C</text>
      <text x="539" y="171">C</text>
      <text x="539" y="221">D</text>
      <text x="539" y="259">E</text>
    </g>
    <g text-anchor="middle" font-size="15" fill="#475569">
      <text x="138" y="289">先に届いたBを使う</text>
      <text x="380" y="289">最新候補のCを使う</text>
      <text x="622" y="289">走査中にD、Eへ切り替える</text>
    </g>
    <text x="25" y="329" font-size="15" fill="#7b3726">破線の位置で絵が切り替わり、縦棒がずれて見える</text>
  </g>
</svg>
