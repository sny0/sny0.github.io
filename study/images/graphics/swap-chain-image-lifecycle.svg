<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title desc" xml:lang="ja">
  <title id="title">スワップチェーン画像を取得してから再利用するまで</title>
  <desc id="desc">画像を取得して同期を待ち、描画する。Presentの待ちを経て表示候補になり、表示側が使い終えると再取得できる。MAILBOXで待ち候補が差し替えられた場合は、表示側での使用を経ずに再利用に進む。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#486078"/>
    </marker>
  </defs>
  <rect width="760" height="365" rx="18" fill="#f8fafc"/>
  <g font-family="'Noto Sans JP', 'Yu Gothic', 'Meiryo', sans-serif" fill="#162334">
    <text x="25" y="40" font-size="23" font-weight="700">1枚のスワップチェーン画像を追う</text>
    <text x="25" y="67" font-size="16" fill="#475569">描画で使う時点と表示側で使う時点を分ける</text>

    <g stroke-width="1.5">
      <rect x="36" y="103" width="196" height="66" rx="8" fill="#e1f4ef" stroke="#4f8678"/>
      <rect x="282" y="103" width="196" height="66" rx="8" fill="#e1f4ef" stroke="#4f8678"/>
      <rect x="528" y="103" width="196" height="66" rx="8" fill="#fff1df" stroke="#a56836"/>
      <rect x="528" y="226" width="196" height="66" rx="8" fill="#e7f2fe" stroke="#587ba5"/>
      <rect x="282" y="226" width="196" height="66" rx="8" fill="#e7f2fe" stroke="#587ba5"/>
      <rect x="36" y="226" width="196" height="66" rx="8" fill="#e1f4ef" stroke="#4f8678"/>
    </g>

    <g fill="none" stroke="#486078" stroke-width="2" marker-end="url(#arrow)">
      <path d="M237 136H276"/>
      <path d="M483 136H522"/>
      <path d="M626 174V220"/>
      <path d="M523 259H484"/>
      <path d="M277 259H238"/>
      <path d="M31 259H18V136H30"/>
      <path d="M626 297V320H134V298" stroke-dasharray="5 4"/>
    </g>

    <g text-anchor="middle">
      <g font-size="18" font-weight="700">
        <text x="134" y="131">1. 取得</text>
        <text x="380" y="131">2. 描画</text>
        <text x="626" y="131">3. Presentの待ち</text>
        <text x="626" y="254">4. 表示候補</text>
        <text x="380" y="254">5. 表示側が使用</text>
        <text x="134" y="254">6. 再取得できる</text>
      </g>
      <g font-size="14" fill="#475569">
        <text x="134" y="152">画像番号と取得の同期</text>
        <text x="380" y="152">GPUが画像に書き込む</text>
        <text x="626" y="152">描画の完了を待つ</text>
        <text x="626" y="275">方式に沿って選ばれる</text>
        <text x="380" y="275">走査に使うなど</text>
        <text x="134" y="275">表示側の使用が終わる</text>
        <text x="380" y="345">MAILBOXで候補が差し替えられた場合は表示せずに再利用へ</text>
      </g>
    </g>
  </g>
</svg>
