<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">NICの受信経路と受信リング</title>
  <desc id="desc">ドライバーが受信先を記述子で渡し、NICが受信フレームをDMAで書く。OSが受信分をUDPソケットへ届け、アプリがrecvfromで読む。受信リングの例では、記述子0と1は回収待ちで、記述子2と3はNICが使える。記述子をたどる位置は末尾の次に先頭へ戻る。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#476278"/>
    </marker>
  </defs>
  <rect width="760" height="500" rx="18" fill="#edf3f7"/>
  <g font-family="system-ui, 'Yu Gothic', Meiryo, sans-serif" fill="#153147">
    <text x="24" y="43" font-size="24" font-weight="700">NICに届いたフレームをアプリが読むまで</text>
    <text x="24" y="71" font-size="16" fill="#476278">PCIe接続のNICでEthernetを受信する例</text>

    <rect x="24" y="94" width="210" height="110" rx="9" fill="#dfeef7" stroke="#9bb5c9"/>
    <rect x="275" y="94" width="210" height="110" rx="9" fill="#fff0d6" stroke="#b69964"/>
    <rect x="526" y="94" width="210" height="110" rx="9" fill="#dcefe6" stroke="#8eb5a1"/>
    <g text-anchor="middle">
      <text x="129" y="125" font-size="18" font-weight="700">1 ドライバー</text>
      <text x="129" y="153" font-size="16">受信バッファを用意</text>
      <text x="129" y="180" font-size="16">記述子でNICに渡す</text>
      <text x="380" y="125" font-size="18" font-weight="700">2 NIC</text>
      <text x="380" y="153" font-size="16">フレームをDMAで書く</text>
      <text x="380" y="180" font-size="16">完了を記録する</text>
      <text x="631" y="120" font-size="18" font-weight="700">3 ドライバーとOS</text>
      <text x="631" y="143" font-size="16">完了した受信を回収</text>
      <text x="631" y="166" font-size="16">UDPソケットへ届ける</text>
      <text x="631" y="189" font-size="16">アプリがrecvfromで読む</text>
    </g>
    <g fill="none" stroke="#476278" stroke-width="2" marker-end="url(#arrow)">
      <path d="M240 149h29"/>
      <path d="M491 149h29"/>
    </g>

    <rect x="24" y="224" width="712" height="252" rx="10" fill="#fff" stroke="#a9bdcc"/>
    <text x="44" y="260" font-size="20" font-weight="700">ある時点の受信リング</text>
    <text x="44" y="286" font-size="15" fill="#476278">各スロットの記述子が、それぞれ受信バッファを指す</text>

    <rect x="44" y="307" width="145" height="91" rx="8" fill="#dcefe6" stroke="#8eb5a1"/>
    <rect x="220" y="307" width="145" height="91" rx="8" fill="#dcefe6" stroke="#8eb5a1"/>
    <rect x="396" y="307" width="145" height="91" rx="8" fill="#fff0d6" stroke="#b69964"/>
    <rect x="572" y="307" width="145" height="91" rx="8" fill="#fff0d6" stroke="#b69964"/>
    <g text-anchor="middle">
      <g font-size="16" font-weight="700">
        <text x="116" y="334">記述子 0</text>
        <text x="292" y="334">記述子 1</text>
        <text x="468" y="334">記述子 2</text>
        <text x="644" y="334">記述子 3</text>
      </g>
      <g font-size="15">
        <text x="116" y="359">バッファ A</text>
        <text x="292" y="359">バッファ B</text>
        <text x="468" y="359">バッファ C</text>
        <text x="644" y="359">バッファ D</text>
        <text x="116" y="382">回収待ち</text>
        <text x="292" y="382">回収待ち</text>
        <text x="468" y="382">NICが使える</text>
        <text x="644" y="382">NICが使える</text>
      </g>
    </g>
    <g fill="none" stroke="#476278" stroke-width="2" marker-end="url(#arrow)">
      <path d="M194 351h20"/>
      <path d="M370 351h20"/>
      <path d="M546 351h20"/>
      <path d="M644 404v21H116v-21"/>
    </g>
    <text x="380" y="451" font-size="16" text-anchor="middle">末尾の次は先頭へ戻る</text>
  </g>
</svg>
