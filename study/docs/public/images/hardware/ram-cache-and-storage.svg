<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">レジスタ・キャッシュ・RAM・SSDの役割</title>
  <desc id="desc">上からレジスタ、CPUキャッシュ、RAM、SSDの役割を比較する。上側は一般に小さく待ち時間が短い。RAMとSSDの読み書きにはOSのI/O処理が関わる。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#45647c"/></marker>
  </defs>
  <rect width="760" height="430" rx="18" fill="#edf3f8"/>
  <g font-family="'Yu Gothic','Meiryo',sans-serif" fill="#173b55">
    <text x="26" y="38" font-size="23" font-weight="700">何を置くかで、記憶場所を使い分ける</text>
    <text x="26" y="65" font-size="15">CPUの近くの小さな記憶と、大きな記憶を組み合わせる</text>
    <path d="M54 104 V327" fill="none" stroke="#45647c" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="77" y="116" font-size="14">一般に小容量</text>
    <text x="77" y="137" font-size="14">待ち時間が短い</text>
    <text x="77" y="309" font-size="14">大容量を</text>
    <text x="77" y="330" font-size="14">用意しやすい</text>
    <rect x="220" y="90" width="510" height="57" rx="9" fill="#dceef9" stroke="#a0c4dc"/>
    <text x="237" y="115" font-size="18" font-weight="700">レジスタ</text>
    <text x="390" y="115" font-size="16">命令の入力と計算結果</text>
    <text x="390" y="136" font-size="14">例　座標を加算するときの値</text>
    <rect x="220" y="157" width="510" height="57" rx="9" fill="#dff0e8" stroke="#9bc5b3"/>
    <text x="237" y="182" font-size="18" font-weight="700">CPUキャッシュ</text>
    <text x="390" y="182" font-size="16">近くで使うメモリの一部</text>
    <text x="390" y="203" font-size="14">例　最近参照した敵の座標の範囲</text>
    <rect x="220" y="224" width="510" height="57" rx="9" fill="#fff1d8" stroke="#c8ad73"/>
    <text x="237" y="249" font-size="18" font-weight="700">RAM・主記憶</text>
    <text x="390" y="249" font-size="16">動作中の命令とデータ</text>
    <text x="390" y="270" font-size="14">例　読み込んだマップと敵の一覧</text>
    <path d="M220 297 H730" fill="none" stroke="#8aa0b3" stroke-dasharray="5 5"/>
    <text x="220" y="318" font-size="14">ファイルの読み書きにはOSのI/O処理が関わる</text>
    <rect x="220" y="330" width="510" height="57" rx="9" fill="#fff" stroke="#afc3d2"/>
    <text x="237" y="355" font-size="18" font-weight="700">SSDなど</text>
    <text x="390" y="355" font-size="16">電源を切っても保存するファイル</text>
    <text x="390" y="376" font-size="14">例　画像ファイル・セーブファイル</text>
    <text x="26" y="413" font-size="14">RAM上の値を変えたあと、セーブするにはファイルへの書き込みを要求する。</text>
  </g>
</svg>
