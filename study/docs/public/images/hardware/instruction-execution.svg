<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">ロード、加算、ストアで5を8にする</title>
  <desc id="desc">説明用の架空のCPU。PCが0でメモリの5をR0へロードし、PCが1で3を加算し、PCが2で8をメモリへストアする。加算後もストア前のメモリは5のままである。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#46637b"/></marker></defs>
  <rect width="760" height="420" rx="18" fill="#edf3f9"/>
  <g font-family="Yu Gothic, Meiryo, sans-serif" fill="#173b56">
    <text x="26" y="40" font-size="25" font-weight="700">メモリの5に3を足して、8を書き戻す</text>
    <text x="26" y="69" font-size="15">架空のCPUの例。PCはこれから実行する命令の番号。</text>
    <rect x="26" y="92" width="708" height="48" rx="9" fill="#dcebf7" stroke="#9bbbd2"/>
    <text x="380" y="122" font-size="17" text-anchor="middle">命令を取得　→　意味を解読　→　操作を実行</text>
    <rect x="26" y="171" width="216" height="210" rx="11" fill="#fff" stroke="#9bbbd2"/>
    <rect x="272" y="171" width="216" height="210" rx="11" fill="#fff1d8" stroke="#bf9d59"/>
    <rect x="518" y="171" width="216" height="210" rx="11" fill="#dff1e8" stroke="#8ab9a2"/>
    <text x="134" y="201" font-size="19" text-anchor="middle" font-weight="700">0　LOAD</text>
    <text x="380" y="201" font-size="19" text-anchor="middle" font-weight="700">1　ADD</text>
    <text x="626" y="201" font-size="19" text-anchor="middle" font-weight="700">2　STORE</text>
    <text x="134" y="231" font-size="16" text-anchor="middle">メモリ → R0</text>
    <text x="380" y="231" font-size="16" text-anchor="middle">R0に3を足す</text>
    <text x="626" y="231" font-size="16" text-anchor="middle">R0 → メモリ</text>
    <path d="M246 225 H266" stroke="#46637b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M492 225 H512" stroke="#46637b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="134" y="276" font-size="19" text-anchor="middle" font-weight="700">R0 = 5</text>
    <text x="380" y="276" font-size="19" text-anchor="middle" font-weight="700">R0 = 8</text>
    <text x="626" y="276" font-size="19" text-anchor="middle" font-weight="700">R0 = 8</text>
    <text x="134" y="315" font-size="18" text-anchor="middle">M[100] = 5</text>
    <text x="380" y="315" font-size="18" text-anchor="middle">M[100] = 5</text>
    <text x="626" y="315" font-size="18" text-anchor="middle" font-weight="700">M[100] = 8</text>
    <text x="134" y="354" font-size="16" text-anchor="middle">次のPCは1</text>
    <text x="380" y="354" font-size="16" text-anchor="middle">次のPCは2</text>
    <text x="626" y="354" font-size="16" text-anchor="middle">次のPCは3</text>
    <text x="26" y="405" font-size="14">M[100]はメモリの100番地の値、R0はCPUのレジスタ。</text>
  </g>
</svg>
