<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
  <title id="title">見た目と当たり判定を用意し、接触の結果を使う</title>
  <desc id="desc">左は描画用の宇宙船のメッシュ。右はその周囲に用意した箱のコライダー。接触の検出結果を使って、物理計算で跳ね返す処理か、ゲームのルールでHPを減らす処理につなげる。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#44647b"/></marker></defs>
  <rect width="760" height="470" rx="18" fill="#edf4f9"/>
  <g font-family="'Yu Gothic',Meiryo,sans-serif" fill="#143d59">
    <text x="26" y="39" font-size="23" font-weight="700">形を調べた結果から、動きやルールへつなぐ</text>
    <rect x="26" y="68" width="336" height="156" rx="11" fill="#fff" stroke="#a4bfd4"/>
    <text x="46" y="97" font-size="17" font-weight="700">描画する形　メッシュ</text>
    <path d="M191 111 250 198 191 178 132 198Z" fill="#b9d7ec" stroke="#44647b" stroke-width="2"/>
    <path d="M191 111V178M132 198 218 150M250 198 164 150" fill="none" stroke="#6e91ab"/>
    <rect x="398" y="68" width="336" height="156" rx="11" fill="#fff" stroke="#a4bfd4"/>
    <text x="418" y="97" font-size="17" font-weight="700">当たり判定の形　コライダー</text>
    <path d="M566 111 625 198 566 178 507 198Z" fill="#dce6ed"/>
    <rect x="497" y="105" width="138" height="102" rx="5" fill="none" stroke="#a67424" stroke-width="3" stroke-dasharray="7 5"/>
    <rect x="26" y="287" width="207" height="82" rx="11" fill="#fff3d9" stroke="#c4a261"/>
    <text x="130" y="319" text-anchor="middle" font-size="18" font-weight="700">接触を検出</text>
    <text x="130" y="348" text-anchor="middle" font-size="15">形の接触や重なり</text>
    <path d="M238 328H288V277H325" fill="none" stroke="#44647b" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M288 328V385H325" fill="none" stroke="#44647b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="332" y="245" width="402" height="67" rx="11" fill="#e1f2ea" stroke="#8fb8a5"/>
    <text x="354" y="272" font-size="17" font-weight="700">物理の応答</text>
    <text x="354" y="296" font-size="15">力や接触を計算して、箱の動きを変える</text>
    <rect x="332" y="352" width="402" height="67" rx="11" fill="#fff" stroke="#a4bfd4"/>
    <text x="354" y="379" font-size="17" font-weight="700">ゲームの処理</text>
    <text x="354" y="403" font-size="15">通知を受け、HPや場面の切り替えを決める</text>
    <text x="26" y="449" font-size="14">トリガーでは、押し返す応答を行わず、重なりの通知を利用する。</text>
  </g>
</svg>
