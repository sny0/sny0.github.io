<svg xmlns="http://www.w3.org/2000/svg" width="760" height="446" viewBox="0 0 760 446" role="img" aria-labelledby="title desc">
  <title id="title">HPを更新し、通知を受けたUIが表示を変える</title>
  <desc id="desc">HPを100から70へ更新した後、対象と新しいHPをイベントで知らせる。購読したHPバーとダメージ演出がそれぞれ表示を更新する。利用開始時に登録し、利用終了時に解除する。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#45677c"/></marker></defs>
  <rect width="760" height="446" rx="18" fill="#edf4f9"/>
  <g font-family="'Yu Gothic',Meiryo,sans-serif" fill="#143d59">
    <text x="26" y="39" font-size="23" font-weight="700">起きた変化を、表示する処理へ伝える</text>
    <text x="26" y="68" font-size="15">HPの状態を更新してから通知する例</text>
    <rect x="26" y="102" width="210" height="111" rx="11" fill="#fff3d9" stroke="#c2a16a"/>
    <text x="131" y="132" text-anchor="middle" font-size="18" font-weight="700">HPを管理する処理</text>
    <text x="131" y="162" text-anchor="middle" font-size="16">100 → 70</text>
    <text x="131" y="190" text-anchor="middle" font-size="15">保持する値を更新</text>
    <rect x="276" y="102" width="210" height="111" rx="11" fill="#dfeefa" stroke="#a2bed2"/>
    <text x="381" y="132" text-anchor="middle" font-size="18" font-weight="700">イベントを発行</text>
    <text x="381" y="162" text-anchor="middle" font-size="15">どの対象が変わったか</text>
    <text x="381" y="190" text-anchor="middle" font-size="15">新しいHPは70</text>
    <path d="M239 157H271" stroke="#45677c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="546" y="102" width="188" height="76" rx="11" fill="#e1f2ea" stroke="#8fb8a5"/>
    <text x="640" y="132" text-anchor="middle" font-size="18" font-weight="700">HPバー</text>
    <text x="640" y="158" text-anchor="middle" font-size="15">70の表示へ更新</text>
    <rect x="546" y="228" width="188" height="76" rx="11" fill="#e1f2ea" stroke="#8fb8a5"/>
    <text x="640" y="258" text-anchor="middle" font-size="18" font-weight="700">ダメージ演出</text>
    <text x="640" y="284" text-anchor="middle" font-size="15">必要な表示を始める</text>
    <path d="M489 140H541" stroke="#45677c" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M516 140V266H541" fill="none" stroke="#45677c" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="26" y="337" width="708" height="80" rx="11" fill="#fff" stroke="#a2bed2"/>
    <text x="46" y="366" font-size="17" font-weight="700">受け手の利用期間に、登録と解除を合わせる</text>
    <text x="46" y="395" font-size="15">UIを用意する → 現在の値を表示・購読する → 終了時に購読を解除する</text>
  </g>
</svg>
