<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-labelledby="title desc">
  <title id="title">phiが経路ごとの値を合流させる</title>
  <desc id="desc">entryでkeepを調べ、真ならtake_upでupを、偽ならtake_downでdownを定義する。joinでphiが直前のブロックに対応する値をoffsetとして選ぶ。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#537286"/>
    </marker>
  </defs>
  <rect width="760" height="352" rx="16" fill="#f1f6f9"/>
  <g font-family="system-ui,sans-serif" fill="#172f45">
    <text x="26" y="40" font-size="24" font-weight="700">phiが経路ごとの値を合流させる</text>
    <g fill="none" stroke="#537286" stroke-width="2" marker-end="url(#arrow)">
      <path d="M354 114 L236 156"/>
      <path d="M406 114 L524 156"/>
      <path d="M208 220 L311 271"/>
      <path d="M552 220 L449 271"/>
    </g>
    <rect x="281" y="63" width="198" height="52" rx="9" fill="#e4f0f8" stroke="#7ba4ba"/>
    <rect x="76" y="158" width="264" height="63" rx="9" fill="#e1f3e9" stroke="#76a991"/>
    <rect x="420" y="158" width="264" height="63" rx="9" fill="#f8eedf" stroke="#b59a76"/>
    <rect x="115" y="273" width="530" height="54" rx="9" fill="#fff" stroke="#7396aa"/>
    <g font-family="Consolas,monospace" font-size="15" text-anchor="middle">
      <text x="380" y="84" font-weight="700">entry</text><text x="380" y="104">br i1 %keep</text>
      <text x="208" y="181" font-weight="700">take_up</text><text x="208" y="204">%up = add i32 %base, 4</text>
      <text x="552" y="181" font-weight="700">take_down</text><text x="552" y="204">%down = sub i32 %base, 1</text>
      <text x="380" y="295" font-weight="700">join</text>
      <text x="380" y="316">%offset = phi i32 [ %up, %take_up ], [ %down, %take_down ]</text>
    </g>
    <g font-size="14" font-weight="650">
      <text x="270" y="130">真</text><text x="477" y="130">偽</text>
      <text x="204" y="251">%up を渡す</text><text x="478" y="251">%down を渡す</text>
    </g>
  </g>
</svg>
