<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description">
  <title id="title">ソースコードを翻訳して実行する二つの経路</title>
  <desc id="description">C++のソースはコンパイルでオブジェクトファイルになり、リンクでネイティブの実行ファイルになる。C#のJIT利用例では、C#コンパイラーがILを生成し、実行時のJITが機械語へ変換する。OSやランタイムが実行を支える。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#3f6278"/></marker>
  </defs>
  <rect width="760" height="430" rx="16" fill="#eef5fa"/>
  <g font-family="system-ui, sans-serif" fill="#183b51">
    <text x="26" y="42" font-size="24" font-weight="700">ソースコードを翻訳して、実行する</text>
    <text x="26" y="70" font-size="15">代表的な流れ。ビルドと実行の段階を見分ける。</text>
    <text x="26" y="105" font-size="17" font-weight="700">C++のネイティブアプリの例</text>
    <g stroke="#a6bed1">
      <rect x="26" y="121" width="136" height="78" rx="10" fill="#fff"/>
      <rect x="208" y="121" width="136" height="78" rx="10" fill="#dfedf8"/>
      <rect x="390" y="121" width="136" height="78" rx="10" fill="#fff"/>
      <rect x="572" y="121" width="162" height="78" rx="10" fill="#e2f2e9"/>
    </g>
    <g text-anchor="middle" font-size="16">
      <text x="94" y="151" font-weight="700">ソース</text><text x="94" y="178">main.cpp</text>
      <text x="276" y="151" font-weight="700">コンパイラー</text><text x="276" y="178">翻訳する</text>
      <text x="458" y="151" font-weight="700">オブジェクト</text><text x="458" y="178">main.objなど</text>
      <text x="653" y="151" font-weight="700">実行ファイル</text><text x="653" y="178">CPU向けの命令</text>
    </g>
    <g stroke="#3f6278" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M169 160H199"/><path d="M351 160H381"/><path d="M533 160H563"/>
    </g>
    <text x="549" y="116" text-anchor="middle" font-size="13">リンク</text>
    <text x="26" y="238" font-size="17" font-weight="700">C#と.NETのJITを使う例</text>
    <g stroke="#a6bed1">
      <rect x="26" y="254" width="136" height="78" rx="10" fill="#fff"/>
      <rect x="208" y="254" width="136" height="78" rx="10" fill="#dfedf8"/>
      <rect x="390" y="254" width="136" height="78" rx="10" fill="#fff"/>
      <rect x="572" y="254" width="162" height="78" rx="10" fill="#e2f2e9"/>
    </g>
    <g text-anchor="middle" font-size="16">
      <text x="94" y="284" font-weight="700">ソース</text><text x="94" y="311">Program.cs</text>
      <text x="276" y="284" font-weight="700">コンパイラー</text><text x="276" y="311">ILへ翻訳する</text>
      <text x="458" y="284" font-weight="700">ILと型の情報</text><text x="458" y="311">中間の表現</text>
      <text x="653" y="284" font-weight="700">JIT → 機械語</text><text x="653" y="311">実行時に変換</text>
    </g>
    <g stroke="#3f6278" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M169 293H199"/><path d="M351 293H381"/><path d="M533 293H563"/>
    </g>
    <text x="26" y="372" font-size="16">OSやランタイムが起動と実行を支える。</text>
    <text x="26" y="401" font-size="15">C#でも、実行前に機械語へ変換するAOTの経路がある。</text>
  </g>
</svg>
