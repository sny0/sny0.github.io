<svg xmlns="http://www.w3.org/2000/svg" width="640" height="738" viewBox="0 0 640 738" role="img" aria-labelledby="title desc">
  <title id="title">シューティングの模式図</title>
  <desc id="desc">640×720ピクセルのModel領域を縮小した模式図。①青い自機は上下左右へ移動する。②金色の弾は上へ進む。③赤い敵は下へ進む。自機の初期位置は320,650、半径は自機18、弾5、敵16ピクセル。実機のスクリーンショットではなく、配置は説明用。</desc>
  <defs>
    <marker id="player-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#2479b8"/></marker>
    <marker id="bullet-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d89a22"/></marker>
    <marker id="enemy-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#d85b4b"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; fill: #26352e; }
    .label { font-size: 24px; font-weight: 700; }
  </style>
  <rect width="640" height="738" rx="16" fill="#f5f8f3"/>
  <text x="320" y="40" text-anchor="middle" font-size="28" font-weight="700">シューティングの模式図</text>
  <text x="320" y="73" text-anchor="middle" font-size="21">Model の領域：640 × 720 px</text>

  <!-- Scale 0.75: the model origin is (80, 96). -->
  <rect x="80" y="96" width="480" height="540" rx="4" fill="#ffffff" stroke="#245d48" stroke-width="3"/>
  <path d="M 320 110 V 623" fill="none" stroke="#dce7de" stroke-width="2" stroke-dasharray="6 9"/>

  <!-- Enemy radius = 16 model pixels, drawn as 12 SVG units. -->
  <g fill="#d85b4b" stroke="#a93f34" stroke-width="1.5">
    <circle cx="128" cy="283.5" r="12"/>
    <circle cx="200" cy="229.875" r="12"/>
    <circle cx="272" cy="176.25" r="12"/>
    <circle cx="344" cy="122.625" r="12"/>
  </g>
  <path d="M 460 169 V 262" fill="none" stroke="#d85b4b" stroke-width="4" marker-end="url(#enemy-arrow)"/>
  <text class="label" x="460" y="305" text-anchor="middle">③ 下降</text>

  <!-- Bullet radius = 5 model pixels. Spacing 58.5 = 520 × 0.15 × 0.75. -->
  <g fill="#d89a22" stroke="#aa7215" stroke-width="1">
    <circle cx="320" cy="316.5" r="3.75"/>
    <circle cx="320" cy="375" r="3.75"/>
    <circle cx="320" cy="433.5" r="3.75"/>
  </g>
  <path d="M 320 282 V 232" fill="none" stroke="#d89a22" stroke-width="4" marker-end="url(#bullet-arrow)"/>
  <path d="M 336 375 H 351" fill="none" stroke="#d89a22" stroke-width="2"/>
  <text class="label" x="365" y="383">② 発射</text>

  <!-- Initial player center: (320, 650); radius = 18 model pixels. -->
  <path d="M 237 583.5 H 403" fill="none" stroke="#2479b8" stroke-width="3" marker-start="url(#player-arrow)" marker-end="url(#player-arrow)"/>
  <path d="M 320 534 V 624" fill="none" stroke="#2479b8" stroke-width="3" marker-start="url(#player-arrow)" marker-end="url(#player-arrow)"/>
  <circle cx="320" cy="583.5" r="13.5" fill="#2479b8" stroke="#175d92" stroke-width="2"/>
  <text class="label" x="416" y="592">① 移動</text>

  <text x="320" y="677" text-anchor="middle" font-size="22">① 自機　　② 弾　　③ 敵</text>
  <text x="320" y="713" text-anchor="middle" font-size="20">配置は説明用。実機のスクリーンショットではありません。</text>
</svg>
