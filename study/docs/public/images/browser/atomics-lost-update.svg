<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1000" viewBox="0 0 760 1000" role="img" aria-labelledby="title description">
  <title id="title">共有カウンターの更新の取りこぼし</title>
  <desc id="description">初期値0に対して、別々のloadとstoreを使うとWorker AとBがともに0を読み、ともに1を書いて結果が1になる。Atomics.addを使うと、先のWorkerは0を返して1を書き、次のWorkerは1を返して2を書く。結果は2になる。</desc>
  <style>
    text { font-family: system-ui, 'Yu Gothic UI', 'Meiryo', sans-serif; fill: #18313b; }
    .title { font-size: 36px; font-weight: 750; }
    .heading { font-size: 29px; font-weight: 700; }
    .body { font-size: 24px; }
    .cell { font-size: 24px; text-anchor: middle; }
    .mono { font-family: 'Cascadia Mono', Consolas, monospace; }
    .label { font-size: 22px; font-weight: 700; text-anchor: middle; }
    .row-number { font-size: 20px; text-anchor: middle; fill: #405c66; }
    .muted { fill: #405c66; }
    .card { fill: #ffffff; stroke: #aabec6; stroke-width: 2; }
    .row { fill: #eef4f6; }
    .line { stroke: #cbdadd; stroke-width: 2; }
    .warning { fill: #794729; }
    .success { fill: #145b4e; }
  </style>
  <rect width="760" height="1000" rx="26" fill="#ebf3f6"/>
  <text class="title" x="36" y="63">共有カウンターの更新</text>
  <text class="body muted" x="36" y="106">二つのWorkerが同じ初期値0に1ずつ加える。</text>

  <rect class="card" x="36" y="138" width="688" height="450" rx="18"/>
  <text class="heading" x="60" y="186">1. load と store を別々に実行</text>
  <text class="body muted" x="60" y="225">両方が0を読んでから、それぞれ書き戻す。</text>
  <rect class="row" x="60" y="246" width="640" height="254" rx="12"/>
  <path class="line" d="M110 246v254m198-254v254m198-254v254M60 294h640m-640 50h640m-640 50h640m-640 50h640"/>
  <text class="label" x="85" y="277">順</text>
  <text class="label" x="209" y="277">Worker A</text>
  <text class="label" x="407" y="277">Worker B</text>
  <text class="label" x="603" y="277">共有値</text>

  <text class="row-number" x="85" y="326">1</text>
  <text class="cell" x="209" y="327"><tspan class="mono">load</tspan> → 0</text>
  <text class="cell" x="603" y="327">0</text>
  <text class="row-number" x="85" y="376">2</text>
  <text class="cell" x="407" y="377"><tspan class="mono">load</tspan> → 0</text>
  <text class="cell" x="603" y="377">0</text>
  <text class="row-number" x="85" y="426">3</text>
  <text class="cell" x="209" y="427"><tspan class="mono">store</tspan> 1</text>
  <text class="cell" x="603" y="427">1</text>
  <text class="row-number" x="85" y="476">4</text>
  <text class="cell" x="407" y="477"><tspan class="mono">store</tspan> 1</text>
  <text class="cell" x="603" y="477">1</text>
  <text class="body warning" x="60" y="551">結果は1。二回目も同じ1を書き込んだ。</text>

  <rect class="card" x="36" y="614" width="688" height="350" rx="18"/>
  <text class="heading" x="60" y="662">2. Atomics.add で一度に更新</text>
  <text class="body muted" x="60" y="701">読み取り・加算・書き戻しを一つにする。</text>
  <rect class="row" x="60" y="722" width="640" height="154" rx="12"/>
  <path class="line" d="M110 722v154m198-154v154m198-154v154M60 770h640m-640 50h640"/>
  <text class="label" x="85" y="753">順</text>
  <text class="label" x="209" y="753">Worker A</text>
  <text class="label" x="407" y="753">Worker B</text>
  <text class="label" x="603" y="753">共有値</text>
  <text class="row-number" x="85" y="803">1</text>
  <text class="cell" x="209" y="804">+1、戻り値0</text>
  <text class="cell" x="603" y="804">1</text>
  <text class="row-number" x="85" y="853">2</text>
  <text class="cell" x="407" y="854">+1、戻り値1</text>
  <text class="cell" x="603" y="854">2</text>
  <text class="body success" x="60" y="927">結果は2。二回の加算がそれぞれ反映された。</text>
</svg>
