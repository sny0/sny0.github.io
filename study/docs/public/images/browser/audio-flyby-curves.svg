<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc">
  <title id="title">正面で高さは440 Hzに戻り、距離ゲインが最大になる</title>
  <desc id="desc">音源が40 m/sで最短距離10 mの直線を通過する。上のグラフでは周波数が接近中の高い値から正面の440 Hzを通り、通過後の低い値へ変わる。下のグラフでは距離ゲインが正面で最大の0.5になる。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; fill: #1e293b; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .note { font-size: 15px; fill: #475569; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="414" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="46" class="title">高さと距離ゲインを同じ時刻で比べる</text>
  <text x="36" y="72" class="note">音源は440 Hz、速さ40 m/s、最短距離10 m。グラフは予測値。</text>
  <text x="82" y="97" class="label">周波数（Hz）</text>
  <text x="82" y="253" class="label">距離ゲイン（倍率）</text>
  <text x="393" y="97" text-anchor="middle" class="label">正面</text>
