      .grid { stroke: #e2e8f0; }
      .guide { stroke: #64748b; stroke-dasharray: 3 5; }
      .full { fill: none; stroke: #1d4ed8; stroke-width: 3; stroke-linejoin: round; }
      .half { fill: none; stroke: #a34113; stroke-width: 3; stroke-dasharray: 9 6; }
    </style>
  </defs>
