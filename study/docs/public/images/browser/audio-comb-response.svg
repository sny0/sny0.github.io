<svg xmlns="http://www.w3.org/2000/svg" width="760" height="670" viewBox="0 0 760 670" role="img" aria-labelledby="title desc">
  <title id="title">遅延時間とゲインを変えたコムフィルターの周波数応答</title>
  <desc id="desc">横軸は0から1,000ヘルツ、縦軸は直流に対する振幅の比をデシベルで示す。上段は遅延2ミリ秒で、谷が250と750ヘルツにある。gが1の実線は谷で完全に打ち消し合い、gが0.5の破線は谷でも約マイナス9.54デシベルに留まる。下段は遅延5ミリ秒でgが1の場合。谷は100ヘルツから200ヘルツ間隔に並ぶ。図ではマイナス60デシベル未満を下端にそろえる。</desc>
