<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc">
  <title id="title">音源が進む側では波面の間隔が狭くなる</title>
  <desc id="desc">右へ進む音源を上から見る。各波面は発生時の音源の位置を中心とし、古い波面ほど大きい。右側の静止した聞き手に向かう波面は間隔が狭く、左側の聞き手に向かう波面は間隔が広い。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; fill: #1e293b; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .note { font-size: 15px; fill: #475569; }
    </style>
    <marker id="motion-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="758" height="414" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="48" class="title">移動した分だけ波面の中心がずれる</text>
  <text x="36" y="76" class="note">上から見た一時点の図。丸は波の山がある場所を示します。</text>
  <path d="M104 220 H656" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 5"/>
  <g fill="none" stroke="#64748b" stroke-width="1.8">
    <circle cx="300" cy="220" r="112"/>
    <circle cx="315" cy="220" r="84"/>
    <circle cx="330" cy="220" r="56"/>
    <circle cx="345" cy="220" r="28"/>
  </g>
  <path d="M368 117 H506" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#motion-arrow)"/>
  <text x="520" y="123" class="note">音源の進行方向</text>
  <g fill="#64748b">
    <circle cx="300" cy="220" r="3"/>
    <circle cx="315" cy="220" r="3"/>
    <circle cx="330" cy="220" r="3"/>
    <circle cx="345" cy="220" r="3"/>
  </g>
  <circle cx="360" cy="220" r="7" fill="#1e293b" stroke="#f8fafc" stroke-width="2"/>
  <path d="M358 231 L350 255" stroke="#64748b" stroke-width="1.5"/>
  <rect x="303" y="255" width="94" height="25" rx="6" fill="#f8fafc"/>
  <text x="350" y="273" text-anchor="middle" class="note">現在の音源</text>
  <g fill="#7c3aed">
    <circle cx="188" cy="220" r="4"/>
    <circle cx="231" cy="220" r="4"/>
    <circle cx="274" cy="220" r="4"/>
    <circle cx="317" cy="220" r="4"/>
  </g>
  <g fill="#0f766e">
    <circle cx="373" cy="220" r="4"/>
    <circle cx="386" cy="220" r="4"/>
    <circle cx="399" cy="220" r="4"/>
    <circle cx="412" cy="220" r="4"/>
  </g>
  <g text-anchor="middle">
    <circle cx="104" cy="220" r="8" fill="#f8fafc" stroke="#7c3aed" stroke-width="3"/>
    <text x="104" y="193" class="label">聞き手 A</text>
    <text x="104" y="253" class="note">静止</text>
    <circle cx="656" cy="220" r="8" fill="#f8fafc" stroke="#0f766e" stroke-width="3"/>
    <text x="656" y="193" class="label">聞き手 B</text>
    <text x="656" y="253" class="note">静止</text>
    <rect x="36" y="348" width="332" height="48" rx="9" fill="#f3e8ff" stroke="#c4b5fd"/>
    <text x="202" y="378" class="label">遠ざかる側では間隔が広い</text>
    <rect x="392" y="348" width="332" height="48" rx="9" fill="#ccfbf1" stroke="#99f6e4"/>
    <text x="558" y="378" class="label">近づく側では間隔が狭い</text>
  </g>
</svg>
