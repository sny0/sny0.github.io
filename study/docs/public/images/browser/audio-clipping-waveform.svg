<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1130" viewBox="0 0 760 1130" role="img" aria-labelledby="title desc">
  <title id="title">同じ音の加算とクリッピング</title>
  <desc id="desc">400 Hzの正弦波を同じ目盛の三段で比較する。ピーク0.65の二つの音を同じ位相で足すとピーク1.30になる。振幅が正負の1を超えた部分をクリップすると山と谷が平らになる。クリップの前でマスターゲインを0.5にするとピーク0.65の正弦波が保たれる。</desc>
  <style>
    text { font-family: "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, sans-serif; fill: #183446; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 22px; fill: #385462; }
    .label { font-size: 25px; font-weight: 700; }
    .body { font-size: 20px; }
    .tick { font-size: 18px; fill: #385462; }
    .limit-text { font-size: 18px; fill: #884637; }
    .panel { fill: #fff; stroke: #a6b8c2; stroke-width: 2; }
    .axis { fill: none; stroke: #8da5b2; stroke-width: 1.4; }
    .limit { fill: none; stroke: #a15b49; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .wave { fill: none; stroke: #17616d; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .clipped { stroke: #994735; }
  </style>
  <defs>
    <g id="grid">
      <rect x="112" y="-100" width="584" height="200" rx="4" fill="#f4f8fa"/>
      <path class="axis" d="M112 0H696 M112 -100V100 M404 -100V100 M696 -100V100"/>
      <path class="limit" d="M112 -76H696 M112 76H696"/>
      <text class="limit-text" x="100" y="-70" text-anchor="end">+1</text>
      <text class="tick" x="100" y="6" text-anchor="end">0</text>
      <text class="limit-text" x="100" y="82" text-anchor="end">−1</text>
      <text class="tick" x="112" y="120" text-anchor="middle">0</text>
      <text class="tick" x="404" y="120" text-anchor="middle">2.5</text>
      <text class="tick" x="696" y="120" text-anchor="end">5 ms</text>
    </g>
  </defs>
  <rect width="760" height="1130" rx="24" fill="#eaf2f4"/>
  <text class="title" x="35" y="65">ゲインを掛ける位置で波形が変わる</text>
  <text class="subtitle" x="35" y="104">ピーク0.65の音源を二つ、同じ位相で足します。</text>

  <rect class="panel" x="35" y="133" width="690" height="311" rx="17"/>
  <text class="label" x="57" y="174">1. クリップ前の合計</text>
  <text class="body" x="57" y="204">マスターゲイン1。ピーク1.30。</text>
