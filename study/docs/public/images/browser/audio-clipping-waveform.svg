    <use href="#grid"/>
    <path class="wave clipped" d="M112.00 0.00 L116.87 -10.33 L121.73 -20.54 L126.60 -30.53 L131.47 -40.19 L136.33 -49.40 L141.20 -58.07 L146.07 -66.11 L150.93 -73.42 L155.80 -76.00 L160.67 -76.00 L165.53 -76.00 L170.40 -76.00 L175.27 -76.00 L180.13 -76.00 L185.00 -76.00 L189.87 -76.00 L194.73 -76.00 L199.60 -76.00 L204.47 -76.00 L209.33 -76.00 L214.20 -76.00 L219.07 -73.42 L223.93 -66.11 L228.80 -58.07 L233.67 -49.40 L238.53 -40.19 L243.40 -30.53 L248.27 -20.54 L253.13 -10.33 L258.00 -0.00 L262.87 10.33 L267.73 20.54 L272.60 30.53 L277.47 40.19 L282.33 49.40 L287.20 58.07 L292.07 66.11 L296.93 73.42 L301.80 76.00 L306.67 76.00 L311.53 76.00 L316.40 76.00 L321.27 76.00 L326.13 76.00 L331.00 76.00 L335.87 76.00 L340.73 76.00 L345.60 76.00 L350.47 76.00 L355.33 76.00 L360.20 76.00 L365.07 73.42 L369.93 66.11 L374.80 58.07 L379.67 49.40 L384.53 40.19 L389.40 30.53 L394.27 20.54 L399.13 10.33 L404.00 0.00 L408.87 -10.33 L413.73 -20.54 L418.60 -30.53 L423.47 -40.19 L428.33 -49.40 L433.20 -58.07 L438.07 -66.11 L442.93 -73.42 L447.80 -76.00 L452.67 -76.00 L457.53 -76.00 L462.40 -76.00 L467.27 -76.00 L472.13 -76.00 L477.00 -76.00 L481.87 -76.00 L486.73 -76.00 L491.60 -76.00 L496.47 -76.00 L501.33 -76.00 L506.20 -76.00 L511.07 -73.42 L515.93 -66.11 L520.80 -58.07 L525.67 -49.40 L530.53 -40.19 L535.40 -30.53 L540.27 -20.54 L545.13 -10.33 L550.00 -0.00 L554.87 10.33 L559.73 20.54 L564.60 30.53 L569.47 40.19 L574.33 49.40 L579.20 58.07 L584.07 66.11 L588.93 73.42 L593.80 76.00 L598.67 76.00 L603.53 76.00 L608.40 76.00 L613.27 76.00 L618.13 76.00 L623.00 76.00 L627.87 76.00 L632.73 76.00 L637.60 76.00 L642.47 76.00 L647.33 76.00 L652.20 76.00 L657.07 73.42 L661.93 66.11 L666.80 58.07 L671.67 49.40 L676.53 40.19 L681.40 30.53 L686.27 20.54 L691.13 10.33 L696.00 0.00"/>
  </g>

  <rect class="panel" x="35" y="767" width="690" height="311" rx="17"/>
  <text class="label" x="57" y="808">3. クリップ前にゲインを下げる</text>
  <text class="body" x="57" y="838">マスターゲイン0.5。ピーク0.65の正弦波です。</text>
