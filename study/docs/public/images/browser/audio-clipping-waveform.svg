    <use href="#grid"/>
    <path class="wave" d="M112.00 0.00 L116.87 -5.16 L121.73 -10.27 L126.60 -15.27 L131.47 -20.09 L136.33 -24.70 L141.20 -29.04 L146.07 -33.06 L150.93 -36.71 L155.80 -39.97 L160.67 -42.78 L165.53 -45.13 L170.40 -46.98 L175.27 -48.32 L180.13 -49.13 L185.00 -49.40 L189.87 -49.13 L194.73 -48.32 L199.60 -46.98 L204.47 -45.13 L209.33 -42.78 L214.20 -39.97 L219.07 -36.71 L223.93 -33.06 L228.80 -29.04 L233.67 -24.70 L238.53 -20.09 L243.40 -15.27 L248.27 -10.27 L253.13 -5.16 L258.00 -0.00 L262.87 5.16 L267.73 10.27 L272.60 15.27 L277.47 20.09 L282.33 24.70 L287.20 29.04 L292.07 33.06 L296.93 36.71 L301.80 39.97 L306.67 42.78 L311.53 45.13 L316.40 46.98 L321.27 48.32 L326.13 49.13 L331.00 49.40 L335.87 49.13 L340.73 48.32 L345.60 46.98 L350.47 45.13 L355.33 42.78 L360.20 39.97 L365.07 36.71 L369.93 33.06 L374.80 29.04 L379.67 24.70 L384.53 20.09 L389.40 15.27 L394.27 10.27 L399.13 5.16 L404.00 0.00 L408.87 -5.16 L413.73 -10.27 L418.60 -15.27 L423.47 -20.09 L428.33 -24.70 L433.20 -29.04 L438.07 -33.06 L442.93 -36.71 L447.80 -39.97 L452.67 -42.78 L457.53 -45.13 L462.40 -46.98 L467.27 -48.32 L472.13 -49.13 L477.00 -49.40 L481.87 -49.13 L486.73 -48.32 L491.60 -46.98 L496.47 -45.13 L501.33 -42.78 L506.20 -39.97 L511.07 -36.71 L515.93 -33.06 L520.80 -29.04 L525.67 -24.70 L530.53 -20.09 L535.40 -15.27 L540.27 -10.27 L545.13 -5.16 L550.00 -0.00 L554.87 5.16 L559.73 10.27 L564.60 15.27 L569.47 20.09 L574.33 24.70 L579.20 29.04 L584.07 33.06 L588.93 36.71 L593.80 39.97 L598.67 42.78 L603.53 45.13 L608.40 46.98 L613.27 48.32 L618.13 49.13 L623.00 49.40 L627.87 49.13 L632.73 48.32 L637.60 46.98 L642.47 45.13 L647.33 42.78 L652.20 39.97 L657.07 36.71 L661.93 33.06 L666.80 29.04 L671.67 24.70 L676.53 20.09 L681.40 15.27 L686.27 10.27 L691.13 5.16 L696.00 0.00"/>
