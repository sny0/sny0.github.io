<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc">
  <title id="title">扉の状態を二つのパラメーターに反映する</title>
  <desc id="desc">ゲーム側で扉が開いて遮蔽が外れたら、音声側でカットオフを1,000から8,000 Hzに、ゲインを0.5から1に変更する。再生中の音源はローパスとゲインを通って出力される。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#334155"/>
    </marker>
    <marker id="controlArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 Z" fill="#6d28d9"/>
    </marker>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; fill: #1e293b; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .note { font-size: 16px; fill: #475569; }
      .control { fill: #5b21b6; }
      .signal { fill: #115e59; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="414" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="48" class="title">扉が開いたらゲインとカットオフを変える</text>
  <text x="36" y="85" class="label control">ゲームの状態</text>
  <g fill="#f5f3ff" stroke="#c4b5fd">
    <rect x="36" y="102" width="161" height="74" rx="10"/>
    <rect x="225" y="102" width="212" height="74" rx="10"/>
    <rect x="465" y="102" width="259" height="74" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="116.5" y="133" class="label">扉が開く</text>
    <text x="116.5" y="157" class="note">開始から400 ms</text>
    <text x="331" y="133" class="label">遮蔽が外れる</text>
    <text x="331" y="157" class="note">ゲーム側で直接経路を判定</text>
    <text x="594.5" y="133" class="label">二つの目標値を予約</text>
    <text x="594.5" y="157" class="note">同じ音声時刻から変化を始める</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M197 139 H220"/>
    <path d="M437 139 H460"/>
  </g>
  <g fill="none" stroke="#6d28d9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#controlArrow)">
    <path d="M594.5 176 V207 H309.5 V246"/>
    <path d="M528 207 V246"/>
  </g>
  <text x="36" y="231" class="label signal">音の経路</text>
  <g fill="#f0fdfa" stroke="#99f6e4">
    <rect x="36" y="251" width="142" height="90" rx="10"/>
    <rect x="206" y="251" width="207" height="90" rx="10"/>
    <rect x="441" y="251" width="174" height="90" rx="10"/>
    <rect x="643" y="251" width="81" height="90" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="107" y="289" class="label">音源</text>
    <text x="107" y="314" class="note">再生を続ける</text>
    <text x="309.5" y="289" class="label">ローパス</text>
    <text x="309.5" y="314" class="note">1,000 → 8,000 Hz</text>
    <text x="528" y="289" class="label">ゲイン</text>
    <text x="528" y="314" class="note">0.5 → 1</text>
    <text x="683.5" y="303" class="label">出力</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)">
    <path d="M178 296 H201"/>
    <path d="M413 296 H436"/>
    <path d="M615 296 H638"/>
  </g>
  <path d="M36 377 H67" stroke="#6d28d9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#controlArrow)"/>
  <text x="78" y="383" class="note">設定の更新</text>
  <path d="M216 377 H247" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="258" y="383" class="note">音声信号の流れ</text>
</svg>
