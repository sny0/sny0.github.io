  <text x="617.4" y="361" text-anchor="middle" class="label">4,000</text>
  <text x="718" y="361" text-anchor="end" class="tick">8,000 Hz</text>
  <text x="400" y="391" text-anchor="middle" class="note">周波数（対数目盛り）</text>
</svg>
