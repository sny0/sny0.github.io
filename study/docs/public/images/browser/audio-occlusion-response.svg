<svg xmlns="http://www.w3.org/2000/svg" width="760" height="416" viewBox="0 0 760 416" role="img" aria-labelledby="title desc">
  <title id="title">ゲインとローパスフィルターによる振幅の変化</title>
  <desc id="desc">遮蔽なしは全周波数で0 dB。ゲイン0.5は全周波数で約マイナス6.02 dB。ゲイン0.5にカットオフ1,000 Hzのローパスを重ねると、250 Hzで約マイナス6.04 dB、4,000 Hzで約マイナス30.50 dBになる。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif; fill: #1e293b; }
      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .note { font-size: 16px; fill: #475569; }
      .tick { font-size: 14px; fill: #475569; }
      .grid { stroke: #cbd5e1; stroke-width: 1; fill: none; }
      .clear { stroke: #475569; stroke-width: 2; fill: none; }
      .gain { stroke: #1d4ed8; stroke-width: 2.5; fill: none; stroke-dasharray: 9 5; }
      .lowpass { stroke: #9a3412; stroke-width: 3; fill: none; }
    </style>
  </defs>
  <rect x="1" y="1" width="758" height="414" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="36" y="48" class="title">ローパスを加えると高音がさらに弱まる</text>
  <text x="36" y="75" class="note">入力に対する振幅比。カットオフ 1,000 Hz、サンプルレート 48,000 Hz</text>
  <path d="M 83 105 H 108" class="clear"/>
  <text x="117" y="110" class="label">遮蔽なし</text>
  <path d="M 222 105 H 247" class="gain"/>
  <text x="256" y="110" class="label">ゲイン 0.5</text>
  <path d="M 382 105 H 407" class="lowpass"/>
  <text x="416" y="110" class="label">ゲイン 0.5 ＋ ローパス</text>
  <rect x="82" y="135" width="636" height="201.6" fill="#fff" stroke="#cbd5e1"/>
  <path d="M 82 185.4 H 718 M 82 235.8 H 718 M 82 286.2 H 718 M 215 135 V 336.6 M 416.19 135 V 336.6 M 617.4 135 V 336.6" class="grid"/>
  <path d="M 82 135 V 336.6 H 718" stroke="#64748b" stroke-width="1.5" fill="none"/>
  <text x="71" y="140" text-anchor="end" class="tick">0 dB</text>
  <text x="71" y="190" text-anchor="end" class="tick">−12</text>
