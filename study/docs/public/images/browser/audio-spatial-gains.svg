<svg xmlns="http://www.w3.org/2000/svg" width="760" height="412" viewBox="0 0 760 412" role="img" aria-labelledby="title desc">
  <title id="title">等電力パンニングの振幅比と距離ゲイン</title>
  <desc id="desc">左の図では方位角に応じて左の振幅比が1から0に下がり、右が0から1に上がる。正面では両方とも約0.707。右の図では距離1まではゲイン1で、距離2では0.5、距離4では0.25、距離8では0.125。</desc>
