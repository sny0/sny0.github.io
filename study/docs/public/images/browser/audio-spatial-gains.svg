      .title { font-size: 26px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .note { font-size: 17px; fill: #475569; }
      .tick { font-size: 15px; fill: #475569; }
      .axis { fill: none; stroke: #64748b; stroke-width: 1.5; }
      .grid { fill: none; stroke: #cbd5e1; stroke-width: 1; }
      .left { fill: none; stroke: #1d4ed8; stroke-width: 3; }
      .right { fill: none; stroke: #9a3412; stroke-width: 3; stroke-dasharray: 7 5; }
      .distance { fill: none; stroke: #0f766e; stroke-width: 3; }
    </style>
  </defs>
