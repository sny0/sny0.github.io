<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc">
  <title id="title">二つの音源をミックスする信号経路</title>
  <desc id="desc">同じ位相の二つのモノラルPCMに個別のGainNodeでゲインを掛け、マスターGainNodeの入力で加算する。マスターの出力は直接つなぐ経路とWaveShaperNodeを通す経路に分かれる。ChannelMergerNodeを使い、結果をAudioBufferのチャンネル0と1に分けて保存する。</desc>
  <style>
    text { font-family: "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, sans-serif; fill: #183446; }
    .title { font-size: 34px; font-weight: 700; }
    .subtitle { font-size: 22px; fill: #385462; }
    .label { font-size: 24px; font-weight: 700; }
    .body { font-size: 22px; }
    .small { font-size: 19px; }
    .mono { font-family: Consolas, "Yu Gothic UI", monospace; }
    .panel { fill: #fff; stroke: #a6b8c2; stroke-width: 2; }
    .blue { fill: #e4eef7; stroke: #abc3d3; }
    .rose { fill: #f7e7e2; stroke: #d3aea2; }
    .arrow { fill: none; stroke: #4d6877; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4d6877"/>
    </marker>
  </defs>
  <rect width="760" height="1040" rx="24" fill="#eaf2f4"/>
  <text class="title" x="35" y="65">二つの音源をミックスする</text>
  <text class="subtitle" x="35" y="104">同じ時点のサンプルを足し、出力を二つの経路で比べます。</text>

  <rect class="panel" x="35" y="132" width="333" height="138" rx="17"/>
  <rect class="panel" x="392" y="132" width="333" height="138" rx="17"/>
  <text class="label" x="57" y="175">音源 A</text>
  <text class="label" x="414" y="175">音源 B</text>
  <text class="body" x="57" y="211">400 HzのPCM・ピーク0.65</text>
  <text class="body" x="414" y="211">400 HzのPCM・ピーク0.65</text>
  <text class="body mono" x="57" y="244">GainNode で × gA</text>
  <text class="body mono" x="414" y="244">GainNode で × gB</text>

  <path class="arrow" d="M201 281V308H345V330"/>
  <path class="arrow" d="M559 281V308H415V330"/>
  <rect class="panel" x="70" y="341" width="620" height="103" rx="17"/>
  <text class="label" x="92" y="382">マスターの入力で加算</text>
  <text class="body mono" x="92" y="417">A[n] × gA + B[n] × gB</text>

  <path class="arrow" d="M380 455V491"/>
  <rect class="panel" x="70" y="502" width="620" height="95" rx="17"/>
  <text class="label" x="92" y="544">マスターの GainNode</text>
  <text class="body" x="92" y="575">合計にマスターゲイン <tspan class="mono">gM</tspan> を掛ける。</text>

  <path class="arrow" d="M380 607V634H201V662"/>
  <path class="arrow" d="M380 607V634H559V662"/>
  <rect class="blue" x="35" y="673" width="333" height="121" rx="17"/>
  <rect class="rose" x="392" y="673" width="333" height="121" rx="17"/>
  <text class="label" x="57" y="714">そのまま</text>
  <text class="label mono" x="414" y="714">WaveShaperNode</text>
  <text class="body" x="57" y="754">マスター出力を読む。</text>
  <text class="body" x="414" y="754">振幅を −1 から 1 に収める。</text>

  <path class="arrow" d="M201 805V839"/>
  <path class="arrow" d="M559 805V839"/>
  <rect class="panel" x="35" y="850" width="690" height="154" rx="17"/>
  <text class="label mono" x="57" y="891">ChannelMergerNode</text>
  <text class="body" x="57" y="934">入力0 → チャンネル0</text>
  <text class="body" x="414" y="934">入力1 → チャンネル1</text>
  <text class="small" x="57" y="976">OfflineAudioContext が比較用の AudioBuffer を返す。</text>
</svg>
