<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">四つの頂点から、二つの三角形を作る</title>
  <desc id="desc">左下から反時計回りに0、1、2、3の番号を付けた四角形。インデックス0・1・2と0・2・3で二つの三角形になる。頂点には位置、法線、UVなどの情報を持たせられる。</desc>
  <rect width="760" height="460" rx="18" fill="#edf4f9"/>
  <g font-family="'Yu Gothic',Meiryo,sans-serif" fill="#173e59">
    <text x="26" y="40" font-size="23" font-weight="700">頂点を番号で選び、三角形で面を作る</text>
    <text x="26" y="69" font-size="15">四角い面を、対角線で二つに分けた説明用の例</text>
    <rect x="26" y="96" width="304" height="244" rx="11" fill="#fff" stroke="#a1bdd3"/>
    <polygon points="78,290 280,290 280,138" fill="#fff0cd" stroke="#58788f" stroke-width="2"/>
    <polygon points="78,290 280,138 78,138" fill="#dcecf8" stroke="#58788f" stroke-width="2"/>
    <g fill="#234d69"><circle cx="78" cy="290" r="5"/><circle cx="280" cy="290" r="5"/><circle cx="280" cy="138" r="5"/><circle cx="78" cy="138" r="5"/></g>
    <text x="59" y="316" font-size="18" font-weight="700">0</text>
    <text x="286" y="316" font-size="18" font-weight="700">1</text>
    <text x="286" y="128" font-size="18" font-weight="700">2</text>
    <text x="59" y="128" font-size="18" font-weight="700">3</text>
    <text x="177" y="269" font-size="17" font-weight="700">0・1・2</text>
    <text x="97" y="182" font-size="17" font-weight="700">0・2・3</text>
    <rect x="356" y="96" width="378" height="244" rx="11" fill="#fff" stroke="#a1bdd3"/>
    <text x="376" y="126" font-size="18" font-weight="700">番号が、どの頂点を使うかを示す</text>
    <text x="376" y="165" font-size="17">三角形1　[0, 1, 2]</text>
    <text x="376" y="200" font-size="17">三角形2　[0, 2, 3]</text>
    <text x="376" y="242" font-size="16">0と2は両方の三角形で使える。</text>
    <text x="376" y="276" font-size="16">辺は、頂点同士のつながり。</text>
    <text x="376" y="310" font-size="16">面は、そのつながりで囲む表面。</text>
    <rect x="26" y="363" width="708" height="73" rx="11" fill="#e1f2e9" stroke="#8fb9a6"/>
    <text x="46" y="391" font-size="17" font-weight="700">描画用の頂点が持つ情報の例</text>
    <text x="46" y="419" font-size="16">位置　＋　法線（表面の向き）　＋　UV（テクスチャ上の位置）</text>
  </g>
</svg>
