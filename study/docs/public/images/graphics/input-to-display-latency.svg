<svg xmlns="http://www.w3.org/2000/svg" width="760" height="312" viewBox="0 0 760 312" role="img" aria-labelledby="title desc">
  <title id="title">入力から画面中央までを追う</title>
  <desc id="desc">入力7 ms、取得8 ms、CPU終了10 ms、GPU開始13 ms、描画終了17 ms、走査開始33.33 ms、画面中央41.67 msの時系列。</desc>
  <rect width="760" height="312" rx="14" fill="#f5f8fa"/>
  <g font-family="system-ui, sans-serif" fill="#183046">
    <text x="24" y="40" font-size="23" font-weight="700">入力から画面中央までを追う</text>
    <text x="24" y="68" font-size="15">仮想60 Hzで1回目の表示機会に間に合わない例</text>
    <path d="M125 100H725" stroke="#536a7c" stroke-width="2"/>
    <path d="M344 99V257M563 99V257" stroke="#536a7c" stroke-dasharray="4 4"/>
    <g font-size="14" text-anchor="middle">
      <text x="125" y="93">0 ms</text><text x="344" y="93">16.67 ms</text><text x="563" y="93">33.33 ms</text>
    </g>
    <g font-size="15" font-weight="700">
      <text x="24" y="133">入力</text><text x="24" y="170">CPU</text>
      <text x="24" y="207">GPU</text><text x="24" y="244">画面</text>
    </g>
    <rect x="217" y="114" width="13" height="20" rx="3" fill="#a9c6d8"/>
    <text x="241" y="130" font-size="14">7 msに到着 → 8 msに取得</text>
    <rect x="230" y="151" width="26" height="20" rx="3" fill="#82bdd3"/>
    <text x="266" y="167" font-size="14">CPU 8〜10 ms</text>
    <rect x="256" y="188" width="40" height="20" rx="3" fill="#edbd7e"/>
    <rect x="296" y="188" width="53" height="20" rx="3" fill="#82bdd3"/>
    <text x="359" y="204" font-size="14">10〜13 ms 待ち、13〜17 ms 描画</text>
    <rect x="563" y="225" width="110" height="20" rx="3" fill="#86c6b1"/>
    <circle cx="673" cy="235" r="5" fill="#23564a"/>
    <text x="554" y="241" text-anchor="end" font-size="14">走査開始</text>
    <text x="673" y="270" text-anchor="middle" font-size="14" font-weight="700">中央 41.67 ms</text>
    <text x="24" y="289" font-size="14" fill="#754415">描画完了は17 ms。16.67 msの走査には入れない。</text>
  </g>
</svg>
