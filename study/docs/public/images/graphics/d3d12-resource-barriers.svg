<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">D3D12の三つのリソースバリア</title>
  <desc id="desc">同じキューにリストAとBを渡す。AがCOPY_DEST状態のバッファへ書き、BがCOPY_SOURCEへ遷移させてから読み戻す。UAVバリアは同じUAV状態のアクセス間の順序を作り、Aliasingバリアは同じヒープ領域で使うリソースを切り替える。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#455e6d"/>
    </marker>
  </defs>
  <rect width="760" height="460" rx="18" fill="#edf2f5"/>
  <g font-family="system-ui, 'Yu Gothic', 'Meiryo', sans-serif" fill="#163347">
    <text x="24" y="42" font-size="24" font-weight="700">D3D12の三つのリソースバリア</text>
    <text x="24" y="68" font-size="14" fill="#385466">先に使うデータと次に使うデータの関係から選ぶ。</text>

    <rect x="24" y="88" width="712" height="161" rx="12" fill="#fff" stroke="#a6bdca"/>
    <text x="43" y="117" font-size="16" font-weight="700">遷移バリアの例</text>
    <text x="716" y="117" text-anchor="end" font-size="14" fill="#385466">同じキューへ A、B の順に提出</text>
    <rect x="43" y="135" width="175" height="77" rx="8" fill="#dfeef3" stroke="#88aebb"/>
    <text x="57" y="158" font-size="14" font-weight="700">リスト A</text>
    <text x="57" y="180" font-size="15">バッファへコピー</text>
    <text x="57" y="199" font-size="13" fill="#385466">COPY_DEST</text>
    <path d="M220 174h26" stroke="#455e6d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="250" y="135" width="260" height="77" rx="8" fill="#fff1d8" stroke="#bb9c5b"/>
    <text x="264" y="158" font-size="14" font-weight="700">リスト B の先頭</text>
    <text x="264" y="181" font-size="15">遷移バリア</text>
    <text x="264" y="201" font-size="13" fill="#385466">COPY_DEST → COPY_SOURCE</text>
    <path d="M512 174h26" stroke="#455e6d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="542" y="135" width="175" height="77" rx="8" fill="#e0efe9" stroke="#86b2a2"/>
    <text x="556" y="158" font-size="14" font-weight="700">リスト B の後続</text>
    <text x="556" y="180" font-size="15">読み戻しへコピー</text>
    <text x="556" y="199" font-size="13" fill="#385466">COPY_SOURCE</text>
    <text x="43" y="234" font-size="13" fill="#385466">同じバッファを、書き込み先から読み取り元に切り替える。</text>

    <rect x="24" y="263" width="712" height="78" rx="12" fill="#fff" stroke="#a6bdca"/>
    <rect x="43" y="280" width="137" height="43" rx="7" fill="#dfeef3" stroke="#88aebb"/>
    <text x="111.5" y="307" text-anchor="middle" font-size="15" font-weight="700">UAV バリア</text>
    <text x="195" y="296" font-size="15">同じ UAV に対する処理の順序を指定する。</text>
    <text x="195" y="318" font-size="13" fill="#385466">例。前の計算が書いたカウンターを、次の計算で読む。</text>

    <rect x="24" y="355" width="712" height="78" rx="12" fill="#fff" stroke="#a6bdca"/>
    <rect x="43" y="372" width="137" height="43" rx="7" fill="#e0efe9" stroke="#86b2a2"/>
    <text x="111.5" y="399" text-anchor="middle" font-size="15" font-weight="700">Aliasing バリア</text>
    <text x="195" y="388" font-size="15">同じヒープ領域で使うリソースを切り替える。</text>
    <text x="195" y="410" font-size="13" fill="#385466">例。一時テクスチャ A を使い終えてから、重なる B を有効にする。</text>
  </g>
</svg>
