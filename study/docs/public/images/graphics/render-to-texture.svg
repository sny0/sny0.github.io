<svg xmlns="http://www.w3.org/2000/svg" width="760" height="424" viewBox="0 0 760 424" role="img" aria-labelledby="title desc">
  <title id="title">描画先のテクスチャを次のパスで読む</title>
  <desc id="desc">パス1はテクスチャAのRTVに描く。遷移バリアでAをRENDER_TARGETからPIXEL_SHADER_RESOURCEへ変える。パス2はAのSRVをt0から読み、別のテクスチャBのRTVへ書く。赤と青を入れ替え、入力の赤と緑が出力の青と緑になる。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#455e6d"/>
    </marker>
  </defs>
  <rect width="760" height="424" rx="18" fill="#edf2f5"/>
  <g font-family="system-ui, 'Yu Gothic', 'Meiryo', sans-serif" fill="#163347">
    <text x="24" y="42" font-size="24" font-weight="700">描画先のテクスチャを次のパスで読む</text>
    <text x="24" y="69" font-size="14" fill="#385466">同じ DIRECT キューで処理する二つのパス。</text>

    <rect x="24" y="92" width="202" height="112" rx="10" fill="#dfeef3" stroke="#88aebb"/>
    <text x="42" y="121" font-size="16" font-weight="700">パス1</text>
    <text x="42" y="151" font-size="15">A の RTV へ描く</text>
    <text x="42" y="178" font-size="13" fill="#385466">A は RENDER_TARGET</text>
    <path d="M228 149h34" stroke="#455e6d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="268" y="92" width="224" height="112" rx="10" fill="#fff1d8" stroke="#bb9c5b"/>
    <text x="286" y="121" font-size="16" font-weight="700">A の遷移バリア</text>
    <text x="286" y="148" font-size="13" fill="#385466">RENDER_TARGET</text>
    <text x="286" y="175" font-size="13" fill="#385466">→ PIXEL_SHADER_RESOURCE</text>
    <path d="M494 149h34" stroke="#455e6d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="534" y="92" width="202" height="112" rx="10" fill="#e0efe9" stroke="#86b2a2"/>
    <text x="552" y="121" font-size="16" font-weight="700">パス2</text>
    <text x="552" y="151" font-size="15">A の SRV を t0 で読む</text>
    <text x="552" y="178" font-size="15">B の RTV へ書く</text>

    <rect x="24" y="225" width="712" height="171" rx="12" fill="#fff" stroke="#a6bdca"/>
    <text x="46" y="257" font-size="15" font-weight="700">A の画像</text>
    <text x="464" y="257" font-size="15" font-weight="700">B の画像</text>

    <rect x="46" y="272" width="119" height="55" rx="5" fill="#f2b9be" stroke="#9e3842"/>
    <rect x="167" y="272" width="119" height="55" rx="5" fill="#cce8d0" stroke="#53865b"/>
    <text x="105.5" y="306" text-anchor="middle" font-size="16" font-weight="700">左は赤</text>
    <text x="226.5" y="306" text-anchor="middle" font-size="16" font-weight="700">右は緑</text>

    <text x="375" y="290" text-anchor="middle" font-size="14" font-weight="700">赤と青を入れ替える</text>
    <path d="M312 313h130" stroke="#455e6d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="464" y="272" width="119" height="55" rx="5" fill="#c6dcf7" stroke="#426797"/>
    <rect x="585" y="272" width="119" height="55" rx="5" fill="#cce8d0" stroke="#53865b"/>
    <text x="523.5" y="306" text-anchor="middle" font-size="16" font-weight="700">左は青</text>
    <text x="644.5" y="306" text-anchor="middle" font-size="16" font-weight="700">右は緑</text>

    <text x="46" y="361" font-size="14" fill="#385466">A の RTV と SRV は同じ画像を指す。処理結果は別の画像 B に書く。</text>
  </g>
</svg>
