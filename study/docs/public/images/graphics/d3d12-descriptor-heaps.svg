<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">D3D12のディスクリプタをフレームごとに割り当てる</title>
  <desc id="desc">一つのシェーダ可視ヒープでフレームAはスロット0から2、Bは3から5を使う。どちらの範囲もCBV b0、SRV t0、SRV t1の順に配置する。BのテーブルはGPUハンドルでスロット3を指す。Aのスロットはフェンス値に達した後に再利用できる。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#455e6d"/>
    </marker>
  </defs>
  <rect width="760" height="430" rx="18" fill="#edf2f5"/>
  <g font-family="system-ui, 'Yu Gothic', 'Meiryo', sans-serif" fill="#163347">
    <text x="24" y="42" font-size="24" font-weight="700">フレームごとにテーブルの先頭を変える</text>
    <text x="24" y="68" font-size="15" fill="#385466">ルートパラメータ0の配置は共通。CBV b0、SRV t0、SRV t1の順。</text>

    <rect x="24" y="88" width="712" height="194" rx="12" fill="#fff" stroke="#a6bdca"/>
    <text x="43" y="116" font-size="16" font-weight="700">シェーダ可視の CBV_SRV_UAV ヒープ</text>
    <text x="43" y="144" font-size="15" font-weight="700">フレーム A</text>
    <text x="388" y="144" font-size="15" font-weight="700">フレーム B</text>

    <g stroke="#88aebb" fill="#dfeef3">
      <rect x="43" y="154" width="104" height="55" rx="7"/>
      <rect x="153" y="154" width="104" height="55" rx="7"/>
      <rect x="263" y="154" width="104" height="55" rx="7"/>
    </g>
    <g stroke="#86b2a2" fill="#e0efe9">
      <rect x="388" y="154" width="104" height="55" rx="7"/>
      <rect x="498" y="154" width="104" height="55" rx="7"/>
      <rect x="608" y="154" width="104" height="55" rx="7"/>
    </g>
    <g text-anchor="middle">
      <g font-size="13" fill="#385466">
        <text x="95" y="175">スロット 0</text>
        <text x="205" y="175">スロット 1</text>
        <text x="315" y="175">スロット 2</text>
        <text x="440" y="175">スロット 3</text>
        <text x="550" y="175">スロット 4</text>
        <text x="660" y="175">スロット 5</text>
      </g>
      <g font-size="16" font-weight="700">
        <text x="95" y="197">CBV b0</text>
        <text x="205" y="197">SRV t0</text>
        <text x="315" y="197">SRV t1</text>
        <text x="440" y="197">CBV b0</text>
        <text x="550" y="197">SRV t0</text>
        <text x="660" y="197">SRV t1</text>
      </g>
    </g>
    <path d="M440 235V213" stroke="#455e6d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="388" y="256" font-size="15">GPUハンドルで B の先頭を渡す</text>

    <rect x="24" y="299" width="712" height="107" rx="12" fill="#fff" stroke="#a6bdca"/>
    <text x="43" y="327" font-size="16" font-weight="700">A の範囲を再利用するまで</text>
    <rect x="43" y="345" width="218" height="42" rx="8" fill="#dfeef3" stroke="#88aebb"/>
    <text x="152" y="371" font-size="15" text-anchor="middle">GPU が A の範囲を参照</text>
    <path d="M269 366h29" stroke="#455e6d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="309" y="345" width="142" height="42" rx="8" fill="#fbf0db" stroke="#be9b55"/>
    <text x="380" y="371" font-size="15" text-anchor="middle">フェンス値に到達</text>
    <path d="M459 366h29" stroke="#455e6d" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="499" y="345" width="213" height="42" rx="8" fill="#e0efe9" stroke="#86b2a2"/>
    <text x="606" y="371" font-size="15" text-anchor="middle">CPU が A の範囲を再利用</text>
  </g>
</svg>
