<svg xmlns="http://www.w3.org/2000/svg" width="760" height="386" viewBox="0 0 760 386" role="img" aria-labelledby="title desc">
  <title id="title">NATの内側と外側で変わるUDPのIPアドレスとポート</title>
  <desc id="desc">往路では送信元を192.0.2.10:55000から198.51.100.20:62000へ変換する。復路では宛先を198.51.100.20:62000から192.0.2.10:55000へ戻す。サーバーの203.0.113.8:30000は往復とも変わらない。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#275c71"/>
    </marker>
  </defs>
  <rect width="760" height="386" rx="16" fill="#eff5f7"/>
  <g font-family="system-ui, 'Yu Gothic UI', 'Meiryo', sans-serif" fill="#173344">
    <text x="24" y="44" font-size="27" font-weight="700">UDPがNATを往復するとき</text>
    <text x="24" y="73" font-size="16">色を付けた行が、NATで書き換わる欄です。</text>

    <text x="24" y="110" font-size="18" font-weight="700">内側（端末A側）</text>
    <text x="466" y="110" font-size="18" font-weight="700">外側（サーバー側）</text>

    <g fill="#fff" stroke="#a3beca">
      <rect x="24" y="124" width="270" height="93" rx="10"/>
      <rect x="466" y="124" width="270" height="93" rx="10"/>
      <rect x="24" y="241" width="270" height="93" rx="10"/>
      <rect x="466" y="241" width="270" height="93" rx="10"/>
    </g>
    <g fill="#d8eef4">
      <rect x="32" y="154" width="254" height="25" rx="4"/>
      <rect x="474" y="154" width="254" height="25" rx="4"/>
      <rect x="32" y="298" width="254" height="25" rx="4"/>
      <rect x="474" y="298" width="254" height="25" rx="4"/>
    </g>

    <g font-size="14">
      <text x="40" y="146" font-weight="700">往路</text>
      <text x="482" y="146" font-weight="700">往路</text>
      <text x="40" y="263" font-weight="700">復路</text>
      <text x="482" y="263" font-weight="700">復路</text>
      <text x="40" y="171">送信元</text>
      <text x="482" y="171">送信元</text>
      <text x="40" y="198">宛先</text>
      <text x="482" y="198">宛先</text>
      <text x="40" y="288">送信元</text>
      <text x="482" y="288">送信元</text>
      <text x="40" y="315">宛先</text>
      <text x="482" y="315">宛先</text>
    </g>
    <g font-family="Consolas, 'Liberation Mono', monospace" font-size="16">
      <text x="104" y="171" font-weight="700">192.0.2.10:55000</text>
      <text x="546" y="171" font-weight="700">198.51.100.20:62000</text>
      <text x="104" y="198">203.0.113.8:30000</text>
      <text x="546" y="198">203.0.113.8:30000</text>
      <text x="104" y="288">203.0.113.8:30000</text>
      <text x="546" y="288">203.0.113.8:30000</text>
      <text x="104" y="315" font-weight="700">192.0.2.10:55000</text>
      <text x="546" y="315" font-weight="700">198.51.100.20:62000</text>
    </g>

    <g fill="#275c71" text-anchor="middle" font-size="16" font-weight="700">
      <text x="380" y="161">送信元を変換</text>
      <text x="380" y="278">宛先を変換</text>
    </g>
    <g fill="none" stroke="#275c71" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M308 180h144"/>
      <path d="M452 297H308"/>
    </g>
    <text x="24" y="363" font-size="15">変換表にある対応を使って、復路のパケットを端末Aへ届けます。</text>
  </g>
</svg>
