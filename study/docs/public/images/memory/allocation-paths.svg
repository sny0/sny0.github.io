<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1800" viewBox="0 0 720 1800" role="img" aria-labelledby="title desc">
  <title id="title">メモリ要求から再利用・OS補充・初期化・解放まで</title>
  <desc id="desc">mallocまたはnewの要求はアロケータの空きを調べ、再利用できる場合と領域の補充が必要な場合に分かれる。new式なら記憶域取得後にオブジェクトを初期化する。deleteは破棄して記憶域を返し、freeは型固有のデストラクタを呼ばず返す。OSへの領域返却は条件付きで、すべての解放で行われるわけではない。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#526057"/></marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#245d48"/></marker>
    <marker id="gold-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 5 L0 10Z" fill="#93650b"/></marker>
  </defs>
  <rect width="720" height="1800" rx="16" fill="#fcfdfb"/>
  <g font-family="BIZ UDPGothic, Yu Gothic, Meiryo, sans-serif" fill="#26352e">
    <text x="36" y="54" font-size="32" font-weight="700">確保と解放の通り道</text>
    <text x="36" y="94" font-size="24">言語の契約と、代表的な管理経路の模式図</text>
    <text x="36" y="126" font-size="24">特定のアロケータの実装図ではありません</text>

    <rect x="36" y="154" width="648" height="88" rx="12" fill="#eaf1eb" stroke="#245d48" stroke-width="2"/>
    <text x="360" y="208" text-anchor="middle" font-size="29" font-weight="700">① malloc(n) / new T</text>
    <path d="M360 242V274" fill="none" stroke="#526057" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="36" y="286" width="648" height="110" rx="12" fill="#f1f4ee" stroke="#acbcae" stroke-width="2"/>
    <text x="360" y="328" text-anchor="middle" font-size="28" font-weight="700">② アロケータの管理</text>
    <text x="360" y="370" text-anchor="middle" font-size="24">要求サイズ・整列条件に合う空きを探す</text>
    <path d="M360 396V426" fill="none" stroke="#526057" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="68" y="438" width="584" height="76" rx="38" fill="#eef0f5" stroke="#6b66a3" stroke-width="2"/>
    <text x="360" y="486" text-anchor="middle" font-size="28" font-weight="700">再利用できる空きがある？</text>
    <path d="M360 514V548H189V588" fill="none" stroke="#245d48" stroke-width="3" marker-end="url(#green-arrow)"/>
    <path d="M360 548H531V588" fill="none" stroke="#93650b" stroke-width="3" marker-end="url(#gold-arrow)"/>
    <text x="140" y="575" font-size="24" fill="#245d48" font-weight="700">ある</text>
    <text x="552" y="575" font-size="24" fill="#93650b" font-weight="700">不足</text>

    <rect x="36" y="600" width="306" height="126" rx="12" fill="#eaf1eb" stroke="#245d48" stroke-width="2"/>
    <text x="189" y="643" text-anchor="middle" font-size="26" font-weight="700">空きブロックを再利用</text>
    <text x="189" y="683" text-anchor="middle" font-size="24">領域の追加要求を省く</text>
    <rect x="378" y="600" width="306" height="126" rx="12" fill="#fbf3df" stroke="#b98c31" stroke-width="2"/>
    <text x="531" y="638" text-anchor="middle" font-size="26" font-weight="700">必要時だけOSへ要求</text>
    <text x="531" y="674" text-anchor="middle" font-size="24">領域を追加・拡張</text>
    <text x="531" y="708" text-anchor="middle" font-size="24">API・方式は実装依存</text>
    <path d="M189 726V764H360V798M531 726V764H360" fill="none" stroke="#526057" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="36" y="810" width="648" height="110" rx="12" fill="#f1f4ee" stroke="#acbcae" stroke-width="2"/>
    <text x="360" y="853" text-anchor="middle" font-size="28" font-weight="700">③ 要求に合う記憶域を得る</text>
    <text x="360" y="892" text-anchor="middle" font-size="24">補充しても取得できなければ失敗</text>
    <path d="M360 920V953" fill="none" stroke="#526057" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="36" y="965" width="648" height="110" rx="12" fill="#eaf1eb" stroke="#245d48" stroke-width="2"/>
    <text x="360" y="1008" text-anchor="middle" font-size="27" font-weight="700">④ new式：オブジェクトを初期化</text>
    <text x="360" y="1047" text-anchor="middle" font-size="24">mallocは型のコンストラクタを呼ばない</text>
    <path d="M360 1075V1108" fill="none" stroke="#526057" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="36" y="1120" width="648" height="100" rx="12" fill="#edf3f8" stroke="#2479b8" stroke-width="2"/>
    <text x="360" y="1159" text-anchor="middle" font-size="28" font-weight="700">⑤ 読み書きして使う</text>
    <text x="360" y="1196" text-anchor="middle" font-size="24">初期化の時点でページに触れる場合もある</text>
    <path d="M360 1220V1253" fill="none" stroke="#526057" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="36" y="1265" width="648" height="110" rx="12" fill="#f1f4ee" stroke="#acbcae" stroke-width="2"/>
    <text x="360" y="1308" text-anchor="middle" font-size="27" font-weight="700">⑥ delete：破棄して記憶域を返す</text>
    <text x="360" y="1347" text-anchor="middle" font-size="24">freeは型のデストラクタを呼ばずに返す</text>
    <path d="M360 1375V1408" fill="none" stroke="#526057" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="36" y="1420" width="648" height="110" rx="12" fill="#eaf1eb" stroke="#245d48" stroke-width="2"/>
    <text x="360" y="1463" text-anchor="middle" font-size="28" font-weight="700">⑦ 空き領域として管理</text>
    <text x="360" y="1502" text-anchor="middle" font-size="24">以後の要求へ再利用できる場合がある</text>
    <path d="M360 1530V1568" fill="none" stroke="#93650b" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#gold-arrow)"/>
    <text x="386" y="1563" font-size="24" fill="#93650b">条件がそろえば</text>

    <rect x="36" y="1580" width="648" height="110" rx="12" fill="#fbf3df" stroke="#b98c31" stroke-width="2"/>
    <text x="360" y="1623" text-anchor="middle" font-size="28" font-weight="700">⑧ OSへ返却</text>
    <text x="360" y="1662" text-anchor="middle" font-size="24">ページ・領域単位。毎回とは限らない</text>
    <text x="36" y="1740" font-size="24">実線：この説明の主な処理順</text>
    <text x="36" y="1776" font-size="24">破線：条件付きのOS返却　失敗経路は本文へ</text>
  </g>
</svg>
