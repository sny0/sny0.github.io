<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="同じ床をWebGL 2で描き、ポイント、バイリニア、ミップマップ、異方性フィルタの見え方を比べる。">
  <title>斜めの床でテクスチャフィルタを比べる | sny0 study</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>斜めの床でテクスチャフィルタを比べる</h1>
      <p>同じ床の模様を、手前の拡大と奥の縮小で見比べます。カメラを動かすと、細かい模様のちらつきも観察できます。</p>
    </header>

    <section class="panel" aria-labelledby="controls-heading">
      <h2 id="controls-heading">サンプリング方法</h2>
      <fieldset id="controls" disabled>
        <legend class="visually-hidden">フィルタとカメラの設定</legend>
        <div class="filters">
          <label><input type="radio" name="filter" value="point" checked> ポイント</label>
          <label><input type="radio" name="filter" value="bilinear"> バイリニア</label>
          <label><input type="radio" name="filter" value="mipmap"> トライリニア（ミップマップ）</label>
          <label><input type="radio" name="filter" value="anisotropic" aria-describedby="anisotropy-status"> 異方性</label>
        </div>
        <label class="motion"><input id="motion" type="checkbox"> カメラを横に動かす</label>
      </fieldset>
      <p id="anisotropy-status" class="support"></p>
    </section>

    <canvas id="view" width="960" height="540" role="img"
      aria-label="市松模様を繰り返す床。下が手前で、上に向かって遠ざかります。">この教材ではcanvasを使います。</canvas>
    <p id="status" role="status">WebGL 2を準備しています。</p>
    <p id="filter-values" class="settings" hidden></p>

    <footer><a href="../../../practice/graphics/texture-filtering-observation.html">実践の解説へ戻る</a></footer>
    <noscript><p>描画するにはJavaScriptを有効にしてください。</p></noscript>
  </main>
</body>
</html>
